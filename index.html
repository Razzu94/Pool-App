<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pool Kontrol - Version 51</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #121212;
            --surface-card: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-color: #00e676;
            --danger-color: #ff5252;
            --border-color: #333333;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --surface-card: #fdfdfd;
            --text-main: #000000;
            --text-muted: #666666;
            --accent-color: #4caf50;
            --danger-color: #d32f2f;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            padding-bottom: 90px;
        }

        .top-nav {
            display: flex;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 15px 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .nav-btn.active {
            color: var(--text-main);
            border-bottom: 3px solid var(--text-main);
        }

        .view-section {
            display: none;
            padding: 15px;
        }

        .view-section.active {
            display: block;
        }

        .opret-container {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .opret-container h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .task-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .task-title {
            font-size: 16px;
            font-weight: bold;
        }

        .task-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .task-details {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .btn-complete {
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .bottom-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-weight: 500;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.7);
            z-index: 200;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body data-theme="dark">

    <nav class="top-nav">
        <button class="nav-btn active" onclick="switchView('tasks-view', this)">Opgaver</button>
        <button class="nav-btn" onclick="switchView('calendar-view', this)">Kalender</button>
        <button class="nav-btn" onclick="switchView('customers-view', this)">Kunder</button>
    </nav>

    <main id="tasks-view" class="view-section active">
        <div class="opret-container">
            <h3>Opret ny opgave</h3>
            <div class="form-group">
                <label>Vælg kunde</label>
                <select id="task-customer-select" class="form-control"></select>
            </div>
            <div class="form-group">
                <label>Dato</label>
                <input type="date" id="task-date-input" class="form-control">
            </div>
            <button class="btn-primary" onclick="createTask()">Gem Opgave</button>
        </div>

        <h2 class="section-title">Dagens opgaver</h2>
        <div id="active-tasks-list"></div>
    </main>

    <main id="calendar-view" class="view-section">
        <h2 class="section-title">Kalender</h2>
        <p style="color:var(--text-muted);">Version 51 standard kalendervisning.</p>
    </main>

    <main id="customers-view" class="view-section">
        <div class="opret-container">
            <h3>Opret ny kunde</h3>
            <div class="form-group">
                <label>Navn</label>
                <input type="text" id="cust-name" class="form-control" placeholder="f.eks. Jensen">
            </div>
            <div class="form-group">
                <label>Adresse</label>
                <input type="text" id="cust-address" class="form-control" placeholder="Vejnavn 12">
            </div>
            <div class="form-group">
                <label>Telefonnummer</label>
                <input type="tel" id="cust-phone" class="form-control" placeholder="12345678">
            </div>
            <div class="form-group">
                <label>Faste kemiværdier / Noter</label>
                <textarea id="cust-notes" class="form-control" rows="3" placeholder="Faste noter..."></textarea>
            </div>
            <button class="btn-primary" onclick="createCustomer()">Opret Kunde</button>
        </div>
        <h2 class="section-title">Kundekartotek</h2>
        <div id="customers-list"></div>
    </main>

    <div class="bottom-bar">
        <button class="bottom-btn" onclick="openModal('tools-modal')">🛠️<br>Værktøj</button>
        <button class="bottom-btn" onclick="openModal('settings-modal')">⚙️<br>Indstillinger</button>
    </div>

    <div id="tools-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🛠️ Værktøjer</h3>
                <button class="close-modal" onclick="closeModal('tools-modal')">Luk</button>
            </div>
            <div class="form-group">
                <label>Vandvolumen (m³)</label>
                <input type="number" class="form-control" placeholder="Indtast m³">
            </div>
            <button class="btn-primary" style="background-color:var(--surface-color); color:var(--text-main); border:1px solid var(--border-color);">Hurtig testberegning</button>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Indstillinger</h3>
                <button class="close-modal" onclick="closeModal('settings-modal')">Luk</button>
            </div>
            <div class="form-group">
                <button class="btn-primary" style="margin-bottom:10px;" onclick="toggleTheme()">Skift Tema</button>
                <button class="btn-primary" style="margin-bottom:10px; background-color:var(--surface-color); color:var(--text-main); border:1px solid var(--border-color);">Lav Backup</button>
                <button class="btn-primary" style="background-color:var(--danger-color); color:white;" onclick="alert('Nulstiller data...')">Nulstil App-data</button>
            </div>
        </div>
    </div>

    <script>
        let customers = JSON.parse(localStorage.getItem('pool_customers')) || [];
        let tasks = JSON.parse(localStorage.getItem('pool_tasks')) || [];

        function saveData() {
            localStorage.setItem('pool_customers', JSON.stringify(customers));
            localStorage.setItem('pool_tasks', JSON.stringify(tasks));
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function switchView(viewId, btnElement) {
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            btnElement.classList.add('active');
        }

        function formatDateString(date) {
            let d = new Date(date),
                month = '' + (d.getMonth() + 1),
                day = '' + d.getDate(),
                year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }

        function updateCustomerDropdowns() {
            const select = document.getElementById('task-customer-select');
            if (!select) return;
            select.innerHTML = customers.map(c => `<option value="${c.id}">${c.name} - ${c.address}</option>`).join('');
            if(customers.length === 0) select.innerHTML = '<option>Opret en kunde først...</option>';
        }

        function createCustomer() {
            const name = document.getElementById('cust-name').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const notes = document.getElementById('cust-notes').value.trim();

            if(!name || !address) return alert('Udfyld venligst både navn og adresse.');

            const newCustomer = { 
                id: Date.now().toString(), 
                name, 
                address, 
                phone: phone || '', 
                notes: notes || '' 
            };
            
            customers.push(newCustomer);
            saveData();
            
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-address').value = '';
            document.getElementById('cust-phone').value = '';
            document.getElementById('cust-notes').value = '';
            
            updateCustomerDropdowns();
            renderCustomers();
            alert('Kunde oprettet succesfuldt!');
        }

        function createTask() {
            const customerId = document.getElementById('task-customer-select').value;
            const dateValue = document.getElementById('task-date-input').value;

            if(!customerId || !dateValue) return alert('Vælg en kunde og en dato.');

            const newTask = {
                id: Date.now().toString(),
                customerId: customerId,
                date: dateValue,
                completed: false
            };

            tasks.push(newTask);
            saveData();
            renderActiveTasks();
            alert('Opgave oprettet!');
        }

        function completeTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if(task) {
                task.completed = true;
                saveData();
                renderActiveTasks();
            }
        }

        function renderActiveTasks() {
            const listContainer = document.getElementById('active-tasks-list');
            if(!listContainer) return;
            listContainer.innerHTML = '';

            const active = tasks.filter(t => !t.completed);

            active.forEach(t => {
                const customer = customers.find(c => c.id === t.customerId) || {name: 'Ukendt', address: 'Ukendt'};
                listContainer.innerHTML += `
                    <div class="task-card">
                        <div class="task-header">
                            <div class="task-title">${customer.name}</div>
                            <div class="task-date">${t.date}</div>
                        </div>
                        <div class="task-details">${customer.address}</div>
                        <button class="btn-complete" onclick="completeTask('${t.id}')">Udført</button>
                    </div>
                `;
            });

            if(active.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 20px;">Ingen aktive opgaver.</p>';
            }
        }

        function renderCustomers() {
            const container = document.getElementById('customers-list');
            if(!container) return;
            container.innerHTML = customers.map(c => `
                <div class="task-card">
                    <div class="task-title">${c.name}</div>
                    <div class="task-details"><b>Adresse:</b> ${c.address}</div>
                    ${c.phone ? `<div class="task-details"><b>Tlf:</b> ${c.phone}</div>` : ''}
                    ${c.notes ? `<div class="task-details" style="font-style:italic; color:var(--text-muted);"><b>Noter:</b> ${c.notes}</div>` : ''}
                </div>
            `).join('');
            if(customers.length === 0) container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Ingen kunder oprettet endnu.</p>';
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        window.onload = function() {
            document.getElementById('task-date-input').value = formatDateString(new Date());
            updateCustomerDropdowns();
            renderActiveTasks();
            renderCustomers();
        };
    </script>
</body>
</html>
