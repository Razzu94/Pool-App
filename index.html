<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Pool Service App v43</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; padding: 15px; padding-top: 80px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; }
        .sektion { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; }
        h2 { color: white; margin-top: 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .top-bar { position: fixed; top: 0; left: 0; right: 0; background: #000; padding: 10px; text-align: center; border-bottom: 1px solid #222; z-index: 90; display: flex; justify-content: center; gap: 5px; }
        .btn-nav { background: #374151; color: #d1d5db; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; max-width: 130px; }
        .btn-nav.active { background: #2563eb; color: white; }
        .card { background: #2a2a2a; border: 1px solid #444; padding: 12px; margin: 10px 0; border-radius: 8px; cursor: pointer; text-align: left; position: relative; }
        .card-actions { position: absolute; right: 10px; top: 12px; display: flex; gap: 10px; z-index: 10; }
        .action-btn { background: none; border: none; font-size: 16px; cursor: pointer; width: auto; margin: 0; padding: 2px; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .radio-group { display: flex; gap: 15px; background: #2a2a2a; padding: 10px; border-radius: 6px; border: 1px solid #444; margin-top: 4px; }
        .radio-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .radio-item input { width: auto; cursor: pointer; }
        .checkbox-group { display: flex; gap: 20px; padding: 5px 0; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
        .checkbox-item input { width: auto; transform: scale(1.2); cursor: pointer; }
        .sorterings-cluster { background: #222; padding: 8px; border-radius: 6px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 5px; }
        .sort-btn { background: #4b5563; color: white; border: none; padding: 6px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; flex: 1; min-width: 80px; }
        .sort-btn.active { background: #2563eb; }
        label { display: block; color: #9ca3af; font-size: 12px; margin-bottom: 4px; }
        input, select, textarea { width: 100%; box-sizing: border-box; background-color: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 14px; }
        button { background: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-annuller { background: #4b5563; }
        .btn-start { background: #2563eb; }
        .btn-afslut { background: #16a34a; }
        .btn-maps { background: #0284c7; margin-bottom: 5px; }
        .btn-slet { background: #dc2626; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 15px; z-index: 100; }
        .modal-content { background: #1e1e1e; border: 1px solid #444; width: 100%; max-width: 380px; border-radius: 10px; padding: 20px; text-align: left; }
        .info-box { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; line-height: 1.5; }
        .kemi-resultat { background: #111827; border-left: 4px solid #2563eb; padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 14px; line-height: 1.5; }
        .badge-status { float: right; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .status-ej-betalt { background: #7f1d1d; color: #fca5a5; }
        .status-betalt { background: #14532d; color: #4ade80; }
        .note-visning { color: #facc15; font-size: 12px; margin-top: 4px; font-style: italic; background: rgba(250,204,21,0.1); padding: 3px 6px; border-radius: 4px; display: inline-block; }
        .omk-liste-item { background: #333; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-top: 4px; display: flex; justify-content: space-between; }
        .img-preview { max-width: 100%; max-height: 150px; margin-top: 8px; border-radius: 6px; border: 1px solid #555; display: block; }
    </style>
</head>
<body>

<div class="top-bar">
    <button id="btn-nav-opg" onclick="visSide('side-opgaver')" class="btn-nav active">📋 Opgaver</button>
    <button id="btn-nav-kar" onclick="visSide('side-kartotek')" class="btn-nav">🏠 Kartotek</button>
    <button id="btn-nav-his" onclick="visSide('side-historik')" class="btn-nav">📜 Historik</button>
</div>

<div class="container">
    <div id="side-opgaver" class="sektion" style="display: block;">
        <h2>📋 Dagens Opgaver</h2>
        <div class="sorterings-cluster">
            <button id="sort-opg-dato-asc" onclick="setOpgaveSortering('dato-asc')" class="sort-btn active">📅 Dato (Nærmeste)</button>
            <button id="sort-opg-dato-desc" onclick="setOpgaveSortering('dato-desc')" class="sort-btn">📅 Dato (Længste)</button>
            <button id="sort-opg-afstand" onclick="setOpgaveSortering('afstand')" class="sort-btn">📍 Afstand (GPS)</button>
        </div>
        <div id="liste-beholder"></div>
        <button onclick="aabenOpretOpgaveSide()">➕ Opret Ny Opgave</button>
        <button onclick="haardNulstilApp()" class="btn-slet" style="margin-top: 40px; font-size: 12px; padding: 8px;">⚠️ Nulstil app-data ved fejl</button>
    </div>

    <div id="side-kartotek" class="sektion">
        <h2>🏠 Kundekartotek</h2>
        <div class="sorterings-cluster">
            <button id="sort-kar-az" onclick="setKartotekSortering('az')" class="sort-btn active">🔤 Navn A-Å</button>
            <button id="sort-kar-za" onclick="setKartotekSortering('za')" class="sort-btn">🔤 Navn Å-A</button>
        </div>
        <div id="kartotek-beholder"></div>
        <button onclick="aabenOpretHusSide()" style="background:#16a34a;">🏠 Tilføj Nyt Hus</button>
    </div>

    <div id="side-historik" class="sektion">
        <h2>📜 Udførte Opgaver (Historik)</h2>
        <div class="sorterings-cluster">
            <button id="sort-his-nyest" onclick="setHistorikSortering('nyest')" class="sort-btn active">⏱️ Nyeste først</button>
            <button id="sort-his-aeldst" onclick="setHistorikSortering('aeldst')" class="sort-btn">⏱️ Ældste først</button>
            <button id="sort-his-az" onclick="setHistorikSortering('az')" class="sort-btn">🔤 Adresse A-Å</button>
        </div>
        <div id="historik-beholder"></div>
    </div>

    <div id="side-opret-opgave" class="sektion">
        <h2 id="opg-skema-titel">➕ Opret Ny Opgave</h2>
        <input id="opg-id-skjult" type="hidden" value="">
        <div class="form-group"><label>Hus *</label><select id="opret-opg-hus-select" onchange="haandterHusValgIOpgave()"></select></div>
        <div class="form-group"><label>Dato *</label><input id="opret-opg-dato" type="date"></div>
        <div class="form-group">
            <label>Opgavetype</label>
            <select id="opret-opg-type" onchange="styreOpgaveTypeFelter()"></select>
        </div>

        <div id="opret-adhoc-specifikke-felter" style="display:none; background:rgba(255,255,255,0.03); padding:10px; border-radius:6px; border:1px solid #444; margin-bottom:12px;">
            <div class="form-group"><label>Opgavens Titel (F.eks. Skift sengeben) *</label><input id="opret-opg-titel" type="text" placeholder="Hvad skal laves?"></div>
            <div class="form-group">
                <label>Afregningsform</label>
                <div class="radio-group">
                    <div class="radio-item"><input type="radio" id="pris-type-time" name="adhoc-pris-type" value="time" checked onclick="styreFastPrisFelt()"> <label for="pris-type-time" style="margin:0;color:white;">Timepris (300 kr./t)</label></div>
                    <div class="radio-item"><input type="radio" id="pris-type-fast" name="adhoc-pris-type" value="fast" onclick="styreFastPrisFelt()"> <label for="pris-type-fast" style="margin:0;color:white;">Fast pris</label></div>
                </div>
            </div>
            <div class="form-group" id="felt-fast-pris-input-ramme" style="display:none;"><label>Aftalt fast pris (kr.) *</label><input id="opret-opg-fastpris-kroner" type="number" placeholder="F.eks. 500"></div>
        </div>

        <div class="form-group"><label>Intern note til denne specifikke opgave</label><input id="opret-opg-note" type="text" placeholder="F.eks. Skal tages efter klokken 14:00"></div>
        <button onclick="gemNyOpgave()">Gem Opgave</button>
        <button onclick="visSide('side-opgaver')" class="btn-annuller">Annuller</button>
    </div>

    <div id="side-opret-hus" class="sektion">
        <h2 id="hus-skema-titel">🏠 Tilføj Hus til Kartotek</h2>
        <input id="hus-id-skjult" type="hidden" value="">
        <div class="form-group"><label>Adresse (Vejnavn og husnummer) *</label><input id="hus-adresse" type="text" placeholder="F.eks. Linnedvænget 9"></div>
        
        <div class="grid-2">
            <div class="form-group"><label>Postnummer</label><input id="hus-postnr" type="number" placeholder="F.eks. 4800" oninput="haandterPostnrInput()"></div>
            <div class="form-group"><label>By</label><input id="hus-by" type="text" placeholder="F.eks. Nykøbing F" oninput="haandterByInput()"></div>
        </div>
        
        <div class="grid-2">
            <div class="form-group"><label>Ejer (Navn)</label><input id="hus-ejer-navn" type="text" placeholder="Navn på ejer 1"></div>
            <div class="form-group"><label>Telefonnummer</label><input id="hus-telefon" type="tel" placeholder="Tlf. ejer 1"></div>
        </div>

        <div class="grid-2">
            <div class="form-group"><label>Ejer 2 (Navn)</label><input id="hus-ejer2-navn" type="text" placeholder="Navn på ejer 2"></div>
            <div class="form-group"><label>Telefonnummer 2</label><input id="hus-telefon2" type="tel" placeholder="Tlf. ejer 2"></div>
        </div>
        
        <div class="grid-2">
            <div class="form-group"><label>Nøglekode</label><input id="hus-kode" type="text"></div>
            <div class="form-group"><label>Placering (Nøgle/Teknikrum)</label><input id="hus-placering" type="text" placeholder="F.eks. Ved bagdøren"></div>
        </div>

        <div class="form-group"><label>Fast note til dette hus (Vises altid på opgaven)</label><textarea id="hus-note" rows="2" placeholder="F.eks. Bemærk larm fra pumpe..."></textarea></div>
        
        <div class="form-group" style="background:#262626; padding:10px; border-radius:6px; border:1px solid #444;">
            <label style="color:#60a5fa; font-weight:bold; margin-bottom:5px;">Faciliteter på grunden (Sæt gerne kryds i begge)</label>
            <div class="checkbox-group">
                <div class="checkbox-item"><input type="checkbox" id="hus-has-pool" onchange="styreHusStaerrelseFelter()"> <label for="hus-has-pool" style="margin:0; color:white;">Pool</label></div>
                <div class="checkbox-item"><input type="checkbox" id="hus-has-spa" onchange="styreHusStaerrelseFelter()"> <label for="hus-has-spa" style="margin:0; color:white;">Spa</label></div>
            </div>
        </div>

        <div class="form-group" id="felt-pool-m3" style="display:none;"><label>Pool størrelse (m³)</label><input id="hus-pool" type="number" value="27"></div>
        <div class="form-group" id="felt-spa-liter" style="display:none;"><label>Spa størrelse (Liter)</label><input id="hus-spa" type="number" value="1500"></div>
        
        <button onclick="gemNytHus()" style="background:#16a34a;" id="btn-gem-hus">Gem i Kartotek</button>
        <button onclick="visSide('side-kartotek')" class="btn-annuller">Annuller</button>
    </div>
</div>

<div id="opgave-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
        <h3 id="m-navn" style="margin:0 0 5px 0;color:white;">Adresse</h3>
        <p id="m-type" style="margin:0 0 15px 0;color:#60a5fa;font-weight:bold;"></p>
        
        <div id="m-noter-ramme" style="margin-bottom:10px;"></div>

        <div class="info-box">
            <p style="margin:2px 0;">📍 <span id="m-adresse"></span></p>
            <p style="margin:2px 0;">📅 Dato: <span id="m-dato-visning" style="color:#a3a3a3;"></span></p>
            <p style="margin:2px 0; color:#facc15; font-weight:bold;">⏳ Sidste kontrol: <span id="m-sidste-kontrol-dato" style="color:white;">-</span></p>
            <p style="margin:2px 0;">🔑 Nøglekode: <strong id="m-kode" style="color:#facc15;"></strong> | Tlf: <span id="m-telefon-visning" style="color:#a3a3a3;">-</span></p>
            <p style="margin:2px 0; color:#38bdf8; font-weight:bold;" id="m-stoerrelse-visning">-</p>
            <p id="m-status" style="margin:5px 0 0 0;font-style:italic;color:#a3a3a3; font-size:12px;"></p>
        </div>
        
        <div id="kemi-sektion" style="display:none; margin-bottom:15px;">
            <div class="grid-2">
                <div class="form-group"><label>Målt klor (mg/l)</label><input id="kemi-maalt-klor" type="number" step="0.1" value="1.0" oninput="beregnKemi()"></div>
                <div class="form-group"><label>Ønsket klor</label><input id="kemi-oensket-klor" type="number" step="0.1" value="6.0" oninput="beregnKemi()"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Målt pH</label><input id="kemi-maalt-ph" type="number" step="0.1" value="7.0" oninput="beregnKemi()"></div>
                <div class="form-group"><label>Ønsket pH</label><input id="kemi-oensket-ph" type="number" step="0.1" value="7.0" oninput="beregnKemi()"></div>
            </div>
            
            <div class="kemi-resultat">
                <strong>Intern Dosering:</strong><br>
                💊 Daytabs: <span id="res-daytabs" style="color: #38bdf8; font-weight: bold;">0</span> stk.<br>
                🚀 Boost: <span id="res-boost" style="color: #60a5fa; font-weight: bold;">0</span> ml.<br>
                📉 Antiklor: <span id="res-antiklor" style="color: #ef4444; font-weight: bold;">0</span> ml.<br>
                ➖ pH-Minus: <span id="res-phminus" style="color: #facc15; font-weight: bold;">0</span> ml.<br>
                ➕ pH-Plus: <span id="res-phplus" style="color: #4ade80; font-weight: bold;">0</span> ml.
            </div>
        </div>

        <div id="igang-felter-container" style="display:none;">
            <div id="m-adhoc-arbejdsrapport-felt" class="form-group" style="background:#222; padding:10px; border-radius:6px; border:1px solid #444; margin-bottom:15px; display:none;">
                <label style="color:#60a5fa; font-weight:bold;">✍️ Hvad har du lavet på denne ad-hoc opgave? *</label>
                <textarea id="m-adhoc-udfoert-tekst" rows="3" placeholder="Beskriv arbejdet her..."></textarea>
            </div>

            <div class="form-group" style="background:#222; padding:10px; border-radius:6px; border:1px solid #444; margin-bottom:15px;">
                <label style="color:#4ade80; font-weight:bold;">📸 Tilføj fotodokumentation (Kamera eller galleri)</label>
                <input type="file" id="m-foto-input" accept="image/*" onchange="haandterFotoValg()">
                <img id="m-foto-preview" class="img-preview" style="display:none;" src="">
            </div>

            <div id="omkostning-sektion" style="background:#2a2a2a; padding:10px; border-radius:6px; margin-bottom:15px; border:1px solid #444;">
                <label style="color:#60a5fa; font-weight:bold; margin-bottom:5px;">➕ Ekstra omkostninger</label>
                <div class="grid-2">
                    <input id="omk-tekst" type="text" placeholder="F.eks. Nyt filter">
                    <input id="omk-pris" type="number" placeholder="Pris i kr.">
                </div>
                <button onclick="tilfoejEkstraOmkostning()" style="background:#4b5563; padding:6px; font-size:12px; margin-top:5px;">➕ Tilføj omkostning</button>
                <div id="omk-liste-ramme" style="margin-top:8px;"></div>
            </div>

            <div id="m-sms-note-ramme-kontrol" class="form-group" style="background:#222; padding:10px; border-radius:6px; border:1px solid #444; margin-bottom:15px;">
                <label style="color:#facc15; font-weight:bold;">✉️ Note direkte til SMS-kvitteringen</label>
                <textarea id="m-sms-note" rows="2" placeholder="F.eks. Jeg har støvsuget bunden..."></textarea>
            </div>
        </div>

        <button onclick="aabenKortNavigation()" id="btn-maps" class="btn-maps">🗺️ Start Navigation</button>
        <button id="btn-start" onclick="startTimer()" class="btn-start">▶ Start Opgave</button>
        
        <div id="afslut-afsnit" style="display:none; margin-top:10px; border-top:1px solid #444; padding-top:10px;">
            <button onclick="afslutOpgave(true)" class="btn-afslut">📲 Afslut & Send SMS-kvittering</button>
            <button onclick="afslutOpgave(false)" style="background:#0284c7; margin-top:5px;">💾 Kun gem i Historik (Ingen SMS)</button>
        </div>
        
        <button onclick="lukOpgaveModal()" class="btn-annuller">Luk vindue</button>
    </div>
</div>

<div id="historik-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
        <h3 style="margin:0 0 10px 0;color:white;">📜 Opgavedetaljer</h3>
        <div id="historik-detaljer-indhold" style="font-size:14px; line-height:1.6; color:#d1d5db;"></div>
        <div id="historik-betalings-knap-ramme" style="margin-top:15px;"></div>
        <button onclick="document.getElementById('historik-modal').style.display='none'" class="btn-annuller">Luk oversigt</button>
    </div>
</div>

<script>
    let kartotek = []; let opgaver = []; let historik = []; let aktivOpgaveId = null;
    let aktuelM3Mængde = 0; let midlertidigOmkListe = []; let gemtFotoBase64 = null;
    let brugerLat = null; let brugerLng = null;
    let opgaveSortering = 'dato-asc'; let kartotekSortering = 'az'; let historikSortering = 'nyest';

    function findByFraPostnr(postnr) {
        let p = parseInt(postnr); if (isNaN(p)) return "";
        if (p >= 4800 && p <= 4849) return "Nykøbing F";
        if (p === 4871) return "Horbelev"; if (p === 4872) return "Idestrup";
        if (p === 4873) return "Væggerløse"; if (p === 4874) return "Gedser";
        if (p === 4880) return "Nysted"; if (p >= 4850 && p <= 4869) return "Stubbekøbing";
        return "";
    }
    function findPostnrFraBy(byNavn) {
        let b = byNavn.toLowerCase().trim();
        if (b.includes("nykøbing")) return "4800"; if (b.includes("horbelev")) return "4871";
        if (b.includes("idestrup")) return "4872"; if (b.includes("væggerløse") || b.includes("marielyst")) return "4873";
        return "";
    }

    function initialiserData() {
        try {
            kartotek = JSON.parse(localStorage.getItem('pool_kartotek')) || [];
            opgaver = JSON.parse(localStorage.getItem('pool_opgaver')) || [];
            historik = JSON.parse(localStorage.getItem('pool_historik')) || [];
        } catch(e) { kartotek = []; opgaver = []; historik = []; }
        startGpsOvervaagning();
    }
    function gemAltTilHukommelse() {
        localStorage.setItem('pool_kartotek', JSON.stringify(kartotek));
        localStorage.setItem('pool_opgaver', JSON.stringify(opgaver));
        localStorage.setItem('pool_historik', JSON.stringify(historik));
    }
    function haandterPostnrInput() {
        let pnr = document.getElementById('hus-postnr').value;
        let fundetBy = findByFraPostnr(pnr);
        if(fundetBy) document.getElementById('hus-by').value = fundetBy;
    }
    function haandterByInput() {
        let byNavn = document.getElementById('hus-by').value;
        let fundetPnr = findPostnrFraBy(byNavn);
        if(fundetPnr) document.getElementById('hus-postnr').value = fundetPnr;
    }
    function startGpsOvervaagning() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                brugerLat = pos.coords.latitude; brugerLng = pos.coords.longitude; bygOpgaveliste();
            }, null, {enableHighAccuracy: true});
        }
    }
    function estimerKoordinater(postnr) { return {lat: 54.7675, lng: 11.8739}; }
    function beregnAfstandKm(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return null;
        let R = 6371; let dLat = (lat2-lat1) * Math.PI / 180; let dLon = (lon2-lon1) * Math.PI / 180;
        let a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function visSide(sideId) {
        document.getElementById('side-opgaver').style.display = 'none';
        document.getElementById('side-kartotek').style.display = 'none';
        document.getElementById('side-historik').style.display = 'none';
        document.getElementById('side-opret-opgave').style.display = 'none';
        document.getElementById('side-opret-hus').style.display = 'none';
        
        let aktivSide = document.getElementById(sideId); if(aktivSide) aktivSide.style.display = 'block';
        document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
        if(sideId === 'side-opgaver') { document.getElementById('btn-nav-opg').classList.add('active'); bygOpgaveliste(); }
        if(sideId === 'side-kartotek') { document.getElementById('btn-nav-kar').classList.add('active'); bygKartotek(); }
        if(sideId === 'side-historik') { document.getElementById('btn-nav-his').classList.add('active'); bygHistorik(); }
    }

    function setOpgaveSortering(type) { opgaveSortering = type; bygOpgaveliste(); }
    function setKartotekSortering(type) { kartotekSortering = type; bygKartotek(); }
    function setHistorikSortering(type) { historikSortering = type; bygHistorik(); }

    function styreHusStaerrelseFelter() {
        document.getElementById('felt-pool-m3').style.display = document.getElementById('hus-has-pool').checked ? 'block' : 'none';
        document.getElementById('felt-spa-liter').style.display = document.getElementById('hus-has-spa').checked ? 'block' : 'none';
    }

    function bygOpgaveliste() {
        let b = document.getElementById('liste-beholder'); if(!b) return; b.innerHTML = '';
        if(opgaver.length === 0) { b.innerHTML = '<p style="color:#6b7280;text-align:center;">Ingen aktive opgaver.</p>'; return; }
        
        let listeKopi = [...opgaver];
        listeKopi.forEach(o => {
            let hus = kartotek.find(h => h.id === o.kartotekId);
            if(hus && brugerLat && brugerLng) {
                let lok = estimerKoordinater(hus.postnr);
                o._afstand = beregnAfstandKm(brugerLat, brugerLng, lok.lat, lok.lng);
            }
        });

        listeKopi.forEach(o => {
            let hus = kartotek.find(h => h.id === o.kartotekId);
            let adresseVisning = hus ? hus.adresse : "Ukendt hus";
            let statusText = o.startet ? '⏳ I GANG' : 'KLAR';
            let labelTypeStr = o.type === "Ad-hoc" ? `Ad-hoc: ${o.titel || ''}` : o.type;
            let noteText = o.note ? `<br><span class="note-visning">📝 ${o.note}</span>` : '';
            
            b.innerHTML += `
                <div class="card" onclick="aabenOpgaveModal(${o.id})">
                    <div class="card-actions">
                        <button class="action-btn" onclick="event.stopPropagation(); redigerOpgave(${o.id})">✏️</button>
                        <button class="action-btn" onclick="event.stopPropagation(); sletOpgave(${o.id})">❌</button>
                    </div>
                    <span style="float:right; background:#374151; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold; color:white; margin-right:55px;">${statusText}</span>
                    <strong>${adresseVisning}</strong><br>
                    <span style="font-size:12px;color:#9ca3af;">📅 ${o.dato} • ${labelTypeStr}</span>
                    ${noteText}
                </div>`;
        });
    }

    function bygKartotek() {
        let b = document.getElementById('kartotek-beholder'); b.innerHTML = '';
        kartotek.forEach(h => {
            let fListe = []; if(h.hasPool) fListe.push("Pool"); if(h.hasSpa) fListe.push("Spa");
            let fTekst = fListe.length > 0 ? fListe.join(" + ") : "Ingen faciliteter markeret";
            b.innerHTML += `
                <div class="card" onclick="redigerHus(${h.id})">
                    <div class="card-actions">
                        <button class="action-btn" onclick="event.stopPropagation(); redigerHus(${h.id})">✏️</button>
                        <button class="action-btn" onclick="event.stopPropagation(); sletHus(${h.id})">❌</button>
                    </div>
                    <strong>${h.adresse}</strong> • 👤 ${h.ejerNavn || '-'}<br>
                    <span style="font-size:12px;color:#9ca3af;">${h.postnr || ''} ${h.by || ''} (${fTekst})</span>
                </div>`;
        });
    }

    function aabenOpretOpgaveSide() {
        document.getElementById('opg-id-skjult').value = "";
        document.getElementById('opg-skema-titel').innerText = "➕ Opret Ny Opgave";
        let select = document.getElementById('opret-opg-hus-select'); select.innerHTML = '';
        kartotek.forEach(h => { select.innerHTML += '<option value="'+h.id+'">'+h.adresse+'</option>'; });
        document.getElementById('opret-opg-dato').value = new Date().toISOString().split('T')[0];
        document.getElementById('opret-opg-note').value = "";
        document.getElementById('opret-opg-titel').value = "";
        document.getElementById('opret-opg-fastpris-kroner').value = "";
        haandterHusValgIOpgave(); visSide('side-opret-opgave');
    }

    function haandterHusValgIOpgave() {
        let hId = parseInt(document.getElementById('opret-opg-hus-select').value); if(!hId) return;
        let hus = kartotek.find(h => h.id === hId); if(!hus) return;
        let typeSelect = document.getElementById('opret-opg-type'); typeSelect.innerHTML = '';
        
        if(hus.hasPool) typeSelect.innerHTML += '<option value="Poolkontrol">Poolkontrol (400 kr.)</option>';
        if(hus.hasSpa) typeSelect.innerHTML += '<option value="Spakontrol">Spakontrol (300 kr.)</option>';
        typeSelect.innerHTML += '<option value="Ad-hoc">Ad-hoc opgave</option>';
        styreOpgaveTypeFelter();
    }

    function styreOpgaveTypeFelter() {
        let t = document.getElementById('opret-opg-type').value;
        document.getElementById('opret-adhoc-specifikke-felter').style.display = (t === "Ad-hoc") ? 'block' : 'none';
        styreFastPrisFelt();
    }
    function styreFastPrisFelt() {
        let isFast = document.getElementById('pris-type-fast').checked;
        let isAdhoc = document.getElementById('opret-opg-type').value === "Ad-hoc";
        document.getElementById('felt-fast-pris-input-ramme').style.display = (isFast && isAdhoc) ? 'block' : 'none';
    }

    function gemNyOpgave() {
        let idSkjult = document.getElementById('opg-id-skjult').value;
        let hId = parseInt(document.getElementById('opret-opg-hus-select').value); if(!hId) return;
        let d = document.getElementById('opret-opg-dato').value;
        let t = document.getElementById('opret-opg-type').value;
        let n = document.getElementById('opret-opg-note').value;
        
        let tStr = document.getElementById('opret-opg-titel').value.trim();
        let pForm = document.querySelector('input[name="adhoc-pris-type"]:checked')?.value || "time";
        let fPris = parseFloat(document.getElementById('opret-opg-fastpris-kroner').value) || 0;

        if(t === "Ad-hoc" && !tStr) { alert("Angiv venligst en titel til ad-hoc opgaven."); return; }

        if(idSkjult) {
            let o = opgaver.find(item => item.id == idSkjult);
            if(o) { o.kartotekId = hId; o.dato = d; o.type = t; o.note = n; o.titel = tStr; o.prisForm = pForm; o.fastPris = fPris; }
        } else {
            opgaver.push({ id: Date.now(), kartotekId: hId, dato: d, type: t, note: n, titel: tStr, prisForm: pForm, fastPris: fPris, startet: null, omkostninger: [] });
        }
        gemAltTilHukommelse(); visSide('side-opgaver');
    }

    function aabenOpretHusSide() {
        document.getElementById('hus-id-skjult').value = "";
        document.getElementById('hus-skema-titel').innerText = "🏠 Tilføj Hus til Kartotek";
        document.getElementById('hus-adresse').value = ""; document.getElementById('hus-by').value = "";
        document.getElementById('hus-postnr').value = ""; document.getElementById('hus-ejer-navn').value = "";
        document.getElementById('hus-telefon').value = ""; document.getElementById('hus-ejer2-navn').value = "";
        document.getElementById('hus-telefon2').value = ""; document.getElementById('hus-kode').value = "";
        document.getElementById('hus-placering').value = ""; document.getElementById('hus-note').value = "";
        document.getElementById('hus-has-pool').checked = true; document.getElementById('hus-has-spa').checked = false;
        document.getElementById('hus-pool').value = "27"; document.getElementById('hus-spa').value = "1500";
        styreHusStaerrelseFelter(); visSide('side-opret-hus');
    }

    function redigerHus(id) {
        let h = kartotek.find(item => item.id === id); if(!h) return;
        document.getElementById('hus-id-skjult').value = h.id;
        document.getElementById('hus-skema-titel').innerText = "✏️ Rediger Hus";
        document.getElementById('hus-adresse').value = h.adresse; document.getElementById('hus-by').value = h.by || "";
        document.getElementById('hus-postnr').value = h.postnr || ""; document.getElementById('hus-ejer-navn').value = h.ejerNavn || "";
        document.getElementById('hus-telefon').value = h.telefon || ""; document.getElementById('hus-ejer2-navn').value = h.ejer2Navn || "";
        document.getElementById('hus-telefon2').value = h.telefon2 || ""; document.getElementById('hus-kode').value = h.kode || "";
        document.getElementById('hus-placering').value = h.placering || ""; document.getElementById('hus-note').value = h.note || "";
        document.getElementById('hus-has-pool').checked = !!h.hasPool; document.getElementById('hus-has-spa').checked = !!h.hasSpa;
        document.getElementById('hus-pool').value = h.pool || 0; document.getElementById('hus-spa').value = h.spa || 0;
        styreHusStaerrelseFelter(); visSide('side-opret-hus');
    }

    function gemNytHus() {
        let idSkjult = document.getElementById('hus-id-skjult').value;
        let adr = document.getElementById('hus-adresse').value; if(!adr) return;
        
        let pB = document.getElementById('hus-has-pool').checked;
        let sB = document.getElementById('hus-has-spa').checked;

        let dataObj = {
            adresse: adr, by: document.getElementById('hus-by').value, postnr: document.getElementById('hus-postnr').value,
            ejerNavn: document.getElementById('hus-ejer-navn').value, telefon: document.getElementById('hus-telefon').value,
            ejer2Navn: document.getElementById('hus-ejer2-navn').value, telefon2: document.getElementById('hus-telefon2').value,
            kode: document.getElementById('hus-kode').value, placering: document.getElementById('hus-placering').value,
            note: document.getElementById('hus-note').value, hasPool: pB, hasSpa: sB,
            pool: parseFloat(document.getElementById('hus-pool').value) || 0,
            spa: parseFloat(document.getElementById('hus-spa').value) || 0
        };

        if(idSkjult) {
            let h = kartotek.find(item => item.id == idSkjult);
            if(h) Object.assign(h, dataObj);
        } else {
            dataObj.id = Date.now(); kartotek.push(dataObj);
        }
        gemAltTilHukommelse(); visSide('side-kartotek');
    }

    function aabenOpgaveModal(id) {
        aktivOpgaveId = id;
        let o = opgaver.find(item => item.id === id); if(!o) return;
        let hus = kartotek.find(h => h.id === o.kartotekId) || {};
        
        if(!o.omkostninger) o.omkostninger = [];
        midlertidigOmkListe = [...o.omkostninger]; tegnOmkostningsListe();
        gemtFotoBase64 = o.fotoB64 || null;
        
        let previewImg = document.getElementById('m-foto-preview');
        if(gemtFotoBase64) { previewImg.src = gemtFotoBase64; previewImg.style.display = 'block'; } 
        else { previewImg.style.display = 'none'; document.getElementById('m-foto-input').value = ""; }

        document.getElementById('m-adhoc-udfoert-tekst').value = o.udfoertRapport || "";

        let nRamme = document.getElementById('m-noter-ramme'); nRamme.innerHTML = "";
        if(hus.note) nRamme.innerHTML += `<div style="background:rgba(56,189,248,0.15); border-left:4px solid #38bdf8; padding:8px; margin-bottom:5px; font-size:13px; color:white;"><strong>🏠 Fast note:</strong> ${hus.note}</div>`;
        if(o.note) nRamme.innerHTML += `<div style="background:rgba(250,204,21,0.15); border-left:4px solid #facc15; padding:8px; font-size:13px; color:white;"><strong>📝 Opgave note:</strong> ${o.note}</div>`;

        document.getElementById('m-navn').innerText = hus.adresse;
        document.getElementById('m-type').innerText = o.type === "Ad-hoc" ? `Ad-hoc: ${o.titel}` : o.type;
        document.getElementById('m-adresse').innerText = hus.adresse + (hus.by ? ", " + hus.by : "");
        document.getElementById('m-kode').innerText = hus.kode || "-";
        document.getElementById('m-dato-visning').innerText = o.dato || "-";
        document.getElementById('m-telefon-visning').innerText = hus.telefon || "-";
        
        if (o.type === "Spakontrol") {
            document.getElementById('m-stoerrelse-visning').innerText = "Spa: " + (hus.spa || 1500) + " L";
            aktuelM3Mængde = (hus.spa > 100) ? (hus.spa / 1000) : hus.spa;
        } else if(o.type === "Poolkontrol") {
            document.getElementById('m-stoerrelse-visning').innerText = "Pool: " + (hus.pool || 27) + " m³";
            aktuelM3Mængde = hus.pool || 27;
        } else {
            document.getElementById('m-stoerrelse-visning').innerText = "Ad-hoc type afregning";
        }
        
        if(o.type === "Poolkontrol" || o.type === "Spakontrol") {
            document.getElementById('kemi-sektion').style.display = 'block';
            document.getElementById('m-sms-note-ramme-kontrol').style.display = 'block';
            document.getElementById('m-adhoc-arbejdsrapport-felt').style.display = 'none';
            beregnKemi();
        } else {
            document.getElementById('kemi-sektion').style.display = 'none';
            document.getElementById('m-sms-note-ramme-kontrol').style.display = 'none';
            document.getElementById('m-adhoc-arbejdsrapport-felt').style.display = 'block';
        }

        if(o.startet) {
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('afslut-afsnit').style.display = 'block';
            document.getElementById('igang-felter-container').style.display = 'block';
            document.getElementById('m-status').innerText = "Status: I gang";
        } else {
            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('afslut-afsnit').style.display = 'none';
            document.getElementById('igang-felter-container').style.display = 'none';
            document.getElementById('m-status').innerText = "Status: Klar";
        }
        document.getElementById('opgave-modal').style.display = 'flex';
    }

    function haandterFotoValg() {
        let file = document.getElementById('m-foto-input').files[0]; if(!file) return;
        let r = new FileReader();
        r.onload = function(e) {
            gemtFotoBase64 = e.target.result;
            let p = document.getElementById('m-foto-preview'); p.src = gemtFotoBase64; p.style.display = 'block';
            let o = opgaver.find(item => item.id === aktivOpgaveId); if(o) { o.fotoB64 = gemtFotoBase64; gemAltTilHukommelse(); }
        };
        r.readAsDataURL(file);
    }

    function tilfoejEkstraOmkostning() {
        let t = document.getElementById('omk-tekst').value.trim();
        let p = parseFloat(document.getElementById('omk-pris').value) || 0; if(!t || p <= 0) return;
        midlertidigOmkListe.push({ tekst: t, pris: p });
        let o = opgaver.find(item => item.id === aktivOpgaveId); if(o) { o.omkostninger = [...midlertidigOmkListe]; gemAltTilHukommelse(); }
        document.getElementById('omk-tekst').value = ""; document.getElementById('omk-pris').value = ""; tegnOmkostningsListe();
    }
    function fjernOmkostning(idx) {
        midlertidigOmkListe.splice(idx, 1);
        let o = opgaver.find(item => item.id === aktivOpgaveId); if(o) { o.omkostninger = [...midlertidigOmkListe]; gemAltTilHukommelse(); }
        tegnOmkostningsListe();
    }
    function tegnOmkostningsListe() {
        let r = document.getElementById('omk-liste-ramme'); r.innerHTML = "";
        midlertidigOmkListe.forEach((omk, idx) => {
            r.innerHTML += `<div class="omk-liste-item"><span>• ${omk.tekst}: <strong>${omk.pris} kr.</strong></span><span onclick="fjernOmkostning(${idx})" style="color:#ef4444; cursor:pointer;">❌</span></div>`;
        });
    }

    function startTimer() {
        let o = opgaver.find(item => item.id === aktivOpgaveId); if(o) o.startet = Date.now();
        gemAltTilHukommelse(); aabenOpgaveModal(aktivOpgaveId);
    }

    function afslutOpgave(sendSmsJaNej) {
        let o = opgaver.find(item => item.id === aktivOpgaveId); if(!o) return;
        let hus = kartotek.find(h => h.id === o.kartotekId) || {};
        let nu = Date.now();
        
        let minutterBrugt = o.startet ? Math.round((nu - o.startet) / 60000) : 1; if(minutterBrugt < 1) minutterBrugt = 1;
        
        let basisPris = 0; let prisLabel = "";
        if(o.type === "Poolkontrol") { basisPris = 400; prisLabel = "Poolkontrol"; }
        else if(o.type === "Spakontrol") { basisPris = 300; prisLabel = "Spakontrol"; }
        else if(o.type === "Ad-hoc") {
            if(o.prisForm === "fast") { basisPris = o.fastPris; prisLabel = "Fast pris"; } 
            else {
                let timerPaabegyndt = Math.ceil(minutterBrugt / 60);
                basisPris = timerPaabegyndt * 300; prisLabel = `Arbejdstid (${timerPaabegyndt} ${timerPaabegyndt === 1 ? 'time' : 'timer'})`;
            }
        }

        let samletEkstraPris = 0;
        midlertidigOmkListe.forEach(omk => samletEkstraPris += omk.pris);
        let totalPris = basisPris + samletEkstraPris;

        let adhocRapportTekst = document.getElementById('m-adhoc-udfoert-tekst').value.trim();
        let smsNoteBruger = (o.type === "Ad-hoc") ? adhocRapportTekst : document.getElementById('m-sms-note').value.trim();

        historik.push({
            _idTid: nu, adresse: hus.adresse, type: o.type, titel: o.titel || '', dato: o.dato, minutter: minutterBrugt,
            basisPris: basisPris, prisLabel: prisLabel, omkostninger: [...midlertidigOmkListe],
            samletPris: totalPris, smsSendt: sendSmsJaNej, betalt: false, noteTilSms: smsNoteBruger, fotoB64: gemtFotoBase64
        });

        if(sendSmsJaNej && hus.telefon) {
            let smsDato = o.dato.split('-').reverse().join('.');
            let smsTekst = `Hej ${hus.ejerNavn || 'ejer'}\n\n`;
            
            if(o.type === "Ad-hoc") {
                smsTekst += `Jeg har d. ${smsDato} udført opgaven: ${o.titel} på ${hus.adresse}.\n\n`;
            } else {
                let facilitetNavn = o.type === "Spakontrol" ? "Spaen" : "Poolen";
                smsTekst += `Jeg har d. ${smsDato} udført ${o.type} på ${hus.adresse}.\n\n`;
                smsTekst += `${facilitetNavn} er nu klar til de nye gæster.\n\n`;
            }
            
            if(smsNoteBruger) smsTekst += `${smsNoteBruger}\n\n`;
            
            smsTekst += `Regning:\n${prisLabel}: ${basisPris} kr.\n`;
            if(midlertidigOmkListe.length > 0) {
                midlertidigOmkListe.forEach(omk => { smsTekst += `${omk.tekst}: ${omk.pris} kr.\n`; });
            }
            smsTekst += `Samlet pris: ${totalPris} kr.\n\n`;
            smsTekst += `Beløbet bedes overføres på MobilePay på 28 68 88 98 indenfor tre dage.\n\n`;
            smsTekst += `Mange hilsner\nDin Poolmand 🏊‍♂️`;
            
            window.location.href = `sms:${hus.telefon}?body=${encodeURIComponent(smsTekst)}`;
        }

        opgaver = opgaver.filter(item => item.id !== aktivOpgaveId);
        gemAltTilHukommelse(); lukOpgaveModal(); visSide('side-historik');
    }

    function visHistorikDetaljer(idTid) {
        let h = historik.find(item => item._idTid === idTid); if(!h) return;
        let tLabel = h.type === "Ad-hoc" ? `Ad-hoc: ${h.titel}` : h.type;
        
        let indhold = `<strong>Hus:</strong> ${h.adresse}<br><strong>Dato:</strong> ${h.dato || '-'}<br><strong>Type:</strong> ${tLabel}<br><hr style="border-color:#444;">`;
        if(h.noteTilSms) indhold += `<strong>✍️ Rapport/Note til ejer:</strong><br><span style="color:#facc15;">"${h.noteTilSms}"</span><hr style="border-color:#444;">`;
        
        indhold += `<strong>💰 Regning:</strong><br>• ${h.prisLabel}: ${h.basisPris} kr.<br>`;
        if(h.omkostninger && h.omkostninger.length > 0) {
            h.omkostninger.forEach(o => { indhold += `• ${o.tekst}: ${o.pris} kr.<br>`; });
        }
        indhold += `<br>• <strong>Total: <span style="color:#4ade80;">${h.samletPris} kr.</span></strong><br>⏱️ Tid brugt: ${h.minutter} min.<hr style="border-color:#444;">`;
        
        if(h.fotoB64) indhold += `<strong>📸 Gemt fotodokumentation:</strong><br><img src="${h.fotoB64}" style="max-width:100%; border-radius:6px; margin-top:5px;">`;

        document.getElementById('historik-modal').style.display = 'flex';
        document.getElementById('historik-detaljer-indhold').innerHTML = indhold;
        
        let ramme = document.getElementById('historik-betalings-knap-ramme');
        ramme.innerHTML = !h.betalt ? `<button onclick="markerSomBetalt(${h._idTid}, true)" style="background:#16a34a;">💵 Markér som BETALT</button>` : `<button onclick="markerSomBetalt(${h._idTid}, false)" style="background:#dc2626;">⚠️ Sæt til IKKE BETALT</button>`;
    }

    function markerSomBetalt(idTid, nyStatus) {
        let h = historik.find(item => item._idTid === idTid);
        if(h) { h.betalt = nyStatus; gemAltTilHukommelse(); document.getElementById('historik-modal').style.display = 'none'; bygHistorik(); }
    }
    function lukOpgaveModal() { document.getElementById('opgave-modal').style.display = 'none'; bygOpgaveliste(); }
    function redigerOpgave(id) { alert("Opgave-detaljer kan ses og styres direkte ved at trykke på kortet."); }
    function sletOpgave(id) { if(confirm("Slet opgave?")) { opgaver = opgaver.filter(o => o.id !== id); gemAltTilHukommelse(); bygOpgaveliste(); } }
    function aabenKortNavigation() { alert("Kortnavigation starter..."); }
    function haardNulstilApp() { if(confirm("Slet alt?")) { localStorage.clear(); initialiserData(); visSide('side-opgaver'); } }

    initialiserData();
    visSide('side-opgaver');
</script>
</body>
</html>
