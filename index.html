<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poolmesteren - Pro V2</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --success: #34c759;
            --danger: #ff3b30;
            --border: #d2d2d7;
            --card-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --text-primary: #f5f5f7;
            --text-secondary: #8e8e93;
            --accent: #0a84ff;
            --success: #30d158;
            --danger: #ff453a;
            --border: #38383a;
            --card-bg: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding-bottom: 75px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Top Navigation / Faner */
        .top-nav {
            position: sticky;
            top: 0;
            background-color: var(--bg-primary);
            display: flex;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 0;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            cursor: pointer;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        /* Hovedindhold */
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Kort / Elementer */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        h2 {
            font-size: 20px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        /* Formularer og felter */
        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        /* Knapper */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: inline-block;
        }

        .btn-primary { background-color: var(--accent); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-secondary { background-color: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }

        /* Ikon-genveje i marken */
        .action-row {
            display: flex;
            gap: 12px;
            margin: 12px 0;
        }

        .icon-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        /* Kalender Matrix */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 13.5%);
            gap: 1%;
            text-align: center;
            margin-top: 10px;
        }

        .cal-header {
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 5px 0;
        }

        .cal-day {
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
        }

        .cal-day.empty { cursor: default; }
        .cal-day.has-future { color: var(--success); font-weight: 700; }
        .cal-day.has-past { color: var(--danger); font-weight: 700; }
        .cal-day.selected { border: 2px solid var(--accent); }

        /* Bund-navigation (Værktøj & Indstillinger) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-primary);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 100;
        }

        .nav-sub-btn {
            flex: 1;
            padding: 14px 0;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            cursor: pointer;
        }

        .nav-sub-btn.active { color: var(--accent); }

        /* Liste elementer til indstillinger (Ren tekst) */
        .settings-list div {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-weight: 500;
        }
        .settings-list div:last-child { border-bottom: none; }

        /* Taleboblestatus eller mikrofondesign */
        .voice-input-wrapper {
            position: relative;
        }
        .voice-btn {
            position: absolute;
            right: 10px;
            top: 38px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="tab-btn active" onclick="switchView('opgaver')">Opgaver</button>
        <button class="tab-btn" onclick="switchView('kalender')">Kalender</button>
        <button class="tab-btn" onclick="switchView('kunder')">Kunder</button>
    </div>

    <div class="container">
        
        <div id="view-opgaver" class="view active">
            <h2>Ugens Opgaver</h2>
            <div id="uge-status" style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;"></div>
            <button class="btn btn-primary" style="margin-bottom:16px;" onclick="openOpretOpgaveModal()">+ Opret Ny Opgave</button>
            <div id="forside-opgaver-liste"></div>
        </div>

        <div id="view-kalender" class="view">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <button class="btn btn-secondary" style="width:auto; padding:6px 12px;" onclick="changeMonth(-1)"><-</button>
                    <h3 id="cal-month-title" style="font-size:16px; font-weight:700;"></h3>
                    <button class="btn btn-secondary" style="width:auto; padding:6px 12px;" onclick="changeMonth(1)">-></button>
                </div>
                <div class="calendar-grid" id="calendar-matrix"></div>
            </div>
            
            <div id="kalender-detaljer" style="display:none;">
                <div id="kalender-opret-sektion"></div>
                <h3 style="font-size:15px; margin: 12px 0 6px 0;">Opgaver på denne dato:</h3>
                <div id="kalender-valgt-dato-liste"></div>
            </div>
        </div>

        <div id="view-kunder" class="view">
            <h2>Kunder</h2>
            <button class="btn btn-primary" style="margin-bottom:16px;" onclick="visOpretKundeForm()">+ Opret Ny Kunde</button>
            
            <div id="opret-kunde-form" class="card" style="display:none; margin-bottom:16px;">
                <h3>Ny Kunde</h3>
                <div class="form-group"><label>Navn</label><input type="text" id="k-navn"></div>
                <div class="form-group"><label>Adresse</label><input type="text" id="k-adresse"></div>
                <div class="form-group"><label>Telefon</label><input type="tel" id="k-tlf"></div>
                <div class="row">
                    <button class="btn btn-success" onclick="gemNyKunde()">Gem Kunde</button>
                    <button class="btn btn-secondary" onclick="skjulOpretKundeForm()">Annuller</button>
                </div>
            </div>
            <div id="kunder-liste"></div>
        </div>

        <div id="view-vaerktoej" class="view">
            <h2>Uafhængig Kemiberegner</h2>
            <div class="card">
                <div class="form-group">
                    <label>Ønsket måling</label>
                    <select id="calc-type">
                        <option value="klor">Klorjustering (Hæv)</option>
                        <option value="ph_minus">pH-Minus</option>
                    </select>
                </div>
                <div class="form-group"><label>Nuværende værdi</label><input type="number" step="0.1" id="calc-nu"></div>
                <div class="form-group"><label>Ønsket værdi</label><input type="number" step="0.1" id="calc-oensk"></div>
                <button class="btn btn-primary" onclick="beregnKemiUafhaengig()">Beregn</button>
                <div id="calc-resultat" style="margin-top:14px; font-weight:700; color:var(--accent);"></div>
            </div>
        </div>

        <div id="view-indstillinger" class="view">
            <h2>Indstillinger</h2>
            <div class="card settings-list">
                <div onclick="toggleTema()">Skift tema</div>
                <div onclick="lavBackup()">Lav backup</div>
                <div onclick="gendanBackup()">Gendan backup</div>
                <div onclick="nulstilKundenumreMedAdvarsel()">Nulstil kundenumre</div>
                <div onclick="nulstilAppMedAdvarsel()">Nulstil/genstart appen</div>
            </div>
        </div>

        <div id="opgave-modal" class="card" style="display:none; position:fixed; top:5%; left:5%; width:90%; max-height:85%; overflow-y:auto; z-index:200; box-shadow:0 4px 20px rgba(0,0,0,0.3);">
            <h3 id="modal-opgave-titel">Opret Opgave</h3>
            <input type="hidden" id="modal-opgave-id">
            
            <div class="form-group">
                <label>Vælg Kunde</label>
                <select id="modal-opgave-kunde" onchange="opdaterModalAdresseTlf()"></select>
            </div>
            
            <div id="modal-action-row" class="action-row" style="display:none;">
                <a id="link-maps" class="icon-btn" target="_blank">🗺️ Kort</a>
                <a id="link-tlf" class="icon-btn">📞 Ring</a>
            </div>

            <div class="form-group"><label>Frekvens (Valgfri)</label>
                <select id="modal-opgave-frekvens">
                    <option value="">Ingen (Enkeltstående)</option>
                    <option value="hver_uge">Hver uge</option>
                    <option value="hver_anden_uge">Hver anden uge</option>
                    <option value="hver_tredje_uge">Hver tredje uge</option>
                    <option value="hver_fjerde_uge">Hver fjerde uge</option>
                </select>
            </div>
            <div class="row">
                <div class="form-group" style="flex:1;"><label>Startdato</label><input type="date" id="modal-opgave-startdato"></div>
                <div class="form-group" style="flex:1;"><label>Slutdato (Kun ved frekvens)</label><input type="date" id="modal-opgave-slutdato"></div>
            </div>
            
            <div class="row">
                <div class="form-group" style="flex:1;"><label>pH-værdi</label><input type="number" step="0.1" id="modal-opgave-ph"></div>
                <div class="form-group" style="flex:1;"><label>Klor-værdi</label><input type="number" step="0.1" id="modal-opgave-klor"></div>
            </div>
            
            <div class="form-group voice-input-wrapper">
                <label>Interne noter</label>
                <textarea id="modal-opgave-noter" rows="3"></textarea>
                <button type="button" class="voice-btn" onclick="startStemmestyring('modal-opgave-noter')">🎙️</button>
            </div>
            
            <div class="row">
                <button class="btn btn-success" onclick="gemOpgaveFraModal()">Gem</button>
                <button class="btn btn-secondary" onclick="lukOpgaveModal()">Luk</button>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <button class="nav-sub-btn active" id="sub-btn-hoved" onclick="switchSubView('hoved')">Værktøjer</button>
        <button class="nav-sub-btn" id="sub-btn-vaerktoej" onclick="switchSubView('vaerktoej')">Beregner</button>
        <button class="nav-sub-btn" id="sub-btn-indstillinger" onclick="switchSubView('indstillinger')">Indstillinger</button>
    </div>

    <script>
        // Lokale databaser (Offline storage)
        let kunder = JSON.parse(localStorage.getItem('pool_kunder')) || [];
        let opgaver = JSON.parse(localStorage.getItem('pool_opgaver')) || [];
        let nuvaerendeTema = localStorage.getItem('pool_tema') || 'dark';
        
        let valgtDatoIKalender = new Date().toISOString().split('T')[0];
        let kalenderVisningDato = new Date();

        // Startkonfiguration
        document.documentElement.setAttribute('data-theme', nuvaerendeTema);

        // --- DATO & UGE LOGIK (DET SKRUMRENDE OVERBLIK) ---
        function hentIgangvaerendeUge() {
            let i Dag = new Date();
            let dagNummer = i Dag.getDay(); // 0 = Søndag, 1 = Mandag...
            
            let mandag = new Date(i Dag);
            if (dagNummer === 0) {
                mandag.setDate(i Dag.getDate() - 6); // Søndag rykker 6 dage tilbage til sin egen uges mandag
            } else {
                mandag.setDate(i Dag.getDate() - (dagNummer - 1));
            }
            
            let soendag = new Date(mandag);
            soendag.setDate(mandag.getDate() + 6);

            return {
                start: mandag.toISOString().split('T')[0],
                slut: soendag.toISOString().split('T')[0]
            };
        }

        // --- VISNINGS-STYRING ---
        function switchView(viewName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            
            // Find den knap der matcher visningen
            const btnIndex = ['opgaver', 'kalender', 'kunder'].indexOf(viewName);
            if(btnIndex !== -1) document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');
            
            document.getElementById(`view-${viewName}`).classList.add('active');
            
            if(viewName === 'opgaver') bygForside();
            if(viewName === 'kalender') bygKalender();
            if(viewName === 'kunder') bygKundeListe();
        }

        function switchSubView(subName) {
            document.querySelectorAll('.nav-sub-btn').forEach(b => b.classList.remove('active'));
            if(subName === 'hoved') {
                document.getElementById('sub-btn-hoved').classList.add('active');
                switchView('opgaver');
            } else {
                document.getElementById(`sub-btn-${subName}`).classList.add('active');
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(`view-${subName}`).classList.add('active');
            }
        }

        // --- KUNDER: LÅSTE NUMRE & LOGIK ---
        function visOpretKundeForm() { document.getElementById('opret-kunde-form').style.display = 'block'; }
        function skjulOpretKundeForm() { document.getElementById('opret-kunde-form').style.display = 'none'; }

        function genererKundenummer() {
            let aar = new Date().getFullYear();
            let naesteNummer = kunder.length + 1;
            return `${aar}-${String(naesteNummer).padStart(3, '0')}`;
        }

        function gemNyKunde() {
            let navn = document.getElementById('k-navn').value.trim();
            let adresse = document.getElementById('k-adresse').value.trim();
            let tlf = document.getElementById('k-tlf').value.trim();
            
            if(!navn) return alert('Indtast navn');

            let nyKunde = {
                id: 'k_' + Date.now(),
                nummer: genererKundenummer(), // Genereres og låses for evigt
                navn: navn,
                adresse: adresse,
                tlf: tlf
            };

            kunder.push(nyKunde);
            localStorage.setItem('pool_kunder', JSON.stringify(kunder));
            skjulOpretKundeForm();
            bygKundeListe();
            
            // Tøm felter
            document.getElementById('k-navn').value = '';
            document.getElementById('k-adresse').value = '';
            document.getElementById('k-tlf').value = '';
        }

        function bygKundeListe() {
            let html = '';
            kunder.forEach(k => {
                html += `<div class="card">
                    <strong>[${k.nummer}] ${k.navn}</strong>
                    <p style="font-size:14px; color:var(--text-secondary); margin-top:4px;">🗺️ ${k.adresse || 'Ingen adresse'}</p>
                    <p style="font-size:14px; color:var(--text-secondary);">📞 ${k.tlf || 'Intet nummer'}</p>
                </div>`;
            });
            document.getElementById('kunder-liste').innerHTML = html;
        }

        // --- OPGEVER & GENERERING (FREKVENS/START/SLUT) ---
        function openOpretOpgaveModal(forudfyldtDato = null) {
            document.getElementById('modal-opgave-titel').innerText = 'Opret Opgave';
            document.getElementById('modal-opgave-id').value = '';
            
            let kundeSelect = document.getElementById('modal-opgave-kunde');
            kundeSelect.innerHTML = kunder.map(k => `<option value="${k.id}">[${k.nummer}] ${k.navn}</option>`).join('');
            
            let dVaelger = document.getElementById('modal-opgave-startdato');
            dVaelger.value = forudfyldtDato || new Date().toISOString().split('T')[0];
            document.getElementById('modal-opgave-slutdato').value = '';
            document.getElementById('modal-opgave-frekvens').value = '';
            
            document.getElementById('modal-opgave-ph').value = '7.2';
            document.getElementById('modal-opgave-klor').value = '1.2';
            document.getElementById('modal-opgave-noter').value = '';
            
            document.getElementById('modal-action-row').style.display = 'none';
            document.getElementById('opgave-modal').style.display = 'block';
            opdaterModalAdresseTlf();
        }

        function opdaterModalAdresseTlf() {
            let kId = document.getElementById('modal-opgave-kunde').value;
            let kunde = kunder.find(k => k.id === kId);
            if(kunde) {
                document.getElementById('modal-action-row').style.display = 'flex';
                document.getElementById('link-maps').href = kunde.adresse ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(kunde.adresse)}` : '#';
                document.getElementById('link-tlf').href = kunde.tlf ? `tel:${kunde.tlf}` : '#';
            }
        }

        function gemOpgaveFraModal() {
            let kId = document.getElementById('modal-opgave-kunde').value;
            let startDatoStr = document.getElementById('modal-opgave-startdato').value;
            let slutDatoStr = document.getElementById('modal-opgave-slutdato').value;
            let frekvens = document.getElementById('modal-opgave-frekvens').value;
            let ph = document.getElementById('modal-opgave-ph').value;
            let klor = document.getElementById('modal-opgave-klor').value;
            let noter = document.getElementById('modal-opgave-noter').value;
            let eksisterendeId = document.getElementById('modal-opgave-id').value;

            if(!kId || !startDatoStr) return alert('Kunde og startdato skal vælges');

            // Hvis det er redigering af en eksisterende enkelt-opgave
            if(eksisterendeId) {
                let opg = opgaver.find(o => o.id === eksisterendeId);
                if(opg) {
                    opg.dato = startDatoStr;
                    opg.ph = ph;
                    opg.klor = klor;
                    opg.noter = noter;
                }
            } else {
                // NY OPRETTELSE (Enkeltstående eller Frekvens-serie)
                if(!frekvens || !slutDatoStr) {
                    // Enkeltstående
                    opgaver.push({
                        id: 'o_' + Date.now(),
                        kundeId: kId,
                        dato: startDatoStr,
                        status: 'aktiv',
                        ph: ph,
                        klor: klor,
                        noter: noter
                    });
                } else {
                    // Sæsonstyret frekvens med start og slut
                    let nuvaerendeDato = new Date(startDatoStr);
                    let stopDato = new Date(slutDatoStr);
                    let intervalDage = 7;
                    if(frekvens === 'hver_anden_uge') intervalDage = 14;
                    if(frekvens === 'hver_tredje_uge') intervalDage = 21;
                    if(frekvens === 'hver_fjerde_uge') intervalDage = 28;

                    let serieId = 's_' + Date.now();
                    while(nuvaerendeDato <= stopDato) {
                        opgaver.push({
                            id: 'o_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                            kundeId: kId,
                            dato: nuvaerendeDato.toISOString().split('T')[0],
                            status: 'aktiv',
                            ph: ph,
                            klor: klor,
                            noter: noter,
                            serieId: serieId
                        });
                        nuvaerendeDato.setDate(nuvaerendeDato.getDate() + intervalDage);
                    }
                }
            }

            localStorage.setItem('pool_opgaver', JSON.stringify(opgaver));
            lukOpgaveModal();
            bygForside();
            bygKalender();
        }

        function lukOpgaveModal() { document.getElementById('opgave-modal').style.display = 'none'; }

        function lukOpgaveDirekteFraForside(opgaveId) {
            let opg = opgaver.find(o => o.id === opgaveId);
            if(opg) {
                // Hent værdierne direkte fra felterne på forsiden
                opg.ph = document.getElementById(`ph-${opgaveId}`).value;
                opg.klor = document.getElementById(`klor-${opgaveId}`).value;
                opg.noter = document.getElementById(`noter-${opgaveId}`).value;
                opg.status = 'lukket';
                localStorage.setItem('pool_opgaver', JSON.stringify(opgaver));
                bygForside();
                bygKalender();
            }
        }

        // --- BYG FORSIDE (UGENS SKRUMRENDE OVERBLIK) ---
        function bygForside() {
            let uge = hentIgangvaerendeUge();
            let dagsDatoStr = new Date().toISOString().split('T')[0];
            let dagensNavn = new Date().toLocaleDateString('da-DK', {weekday: 'long'});
            
            document.getElementById('uge-status').innerText = `Uge-periode: ${uge.start} til ${uge.slut} (I dag er det ${dagensNavn})`;

            // Filtrer så den KUN viser fra dags dato og frem til søndag i den igangværende uge
            let ugensOpgaver = opgaver.filter(o => o.dato >= dagsDatoStr && o.dato <= uge.slut && o.status === 'aktiv');
            
            // Sorter efter dato
            ugensOpgaver.sort((a,b) => a.dato.localeCompare(b.dato));

            let html = '';
            if(ugensOpgaver.length === 0) {
                html = '<div class="card" style="text-align:center; color:var(--text-secondary);">Ingen manglende opgaver tilbage i denne uge!</div>';
            } else {
                ugensOpgaver.forEach(o => {
                    let kunde = kunder.find(k => k.id === o.kundeId) || {navn: 'Ukendt', nummer: '???', adresse: '', tlf: ''};
                    let dNavn = new Date(o.dato).toLocaleDateString('da-DK', {weekday: 'short', day: 'numeric'});
                    
                    html += `<div class="card">
                        <div style="display:flex; justify-content:space-between;">
                            <strong>[${kunde.nummer}] ${kunde.navn}</strong>
                            <span style="font-size:12px; font-weight:700; color:var(--accent);">${dNavn}</span>
                        </div>
                        <p style="font-size:13px; color:var(--text-secondary); margin-bottom:8px;">🗺️ ${kunde.adresse}</p>
                        
                        <div class="row" style="margin-bottom:8px;">
                            <div style="flex:1;"><label>pH</label><input type="number" step="0.1" id="ph-${o.id}" value="${o.ph}"></div>
                            <div style="flex:1;"><label>Klor</label><input type="number" step="0.1" id="klor-${o.id}" value="${o.klor}"></div>
                        </div>
                        <div class="form-group voice-input-wrapper">
                            <label>Noter</label>
                            <textarea id="noter-${o.id}" rows="1">${o.noter || ''}</textarea>
                            <button type="button" class="voice-btn" style="top:26px;" onclick="startStemmestyring('noter-${o.id}')">🎙️</button>
                        </div>
                        <button class="btn btn-success" onclick="lukOpgaveDirekteFraForside('${o.id}')">Udført & Gem</button>
                    </div>`;
                });
            }
            document.getElementById('forside-opgaver-liste').innerHTML = html;
        }

        // --- KALENDER LOGIK (MÅNEDSMATRIX) ---
        function changeMonth(direction) {
            kalenderVisningDato.setMonth(kalenderVisningDato.getMonth() + direction);
            bygKalender();
        }

        function bygKalender() {
            let aar = kalenderVisningDato.getFullYear();
            let mdr = kalenderVisningDato.getMonth();
            
            let mdrNavne = ["Januar", "Februar", "Marts", "April", "Maj", "Juni", "Juli", "August", "September", "Oktober", "November", "December"];
            document.getElementById('cal-month-title').innerText = `${mdrNavne[mdr]} ${aar}`;

            let foersteDagIMdr = new Date(aar, mdr, 1).getDay();
            let antalDageIMdr = new Date(aar, mdr + 1, 0).getDate();
            
            // Juster til dansk ugestart (Mandag som første dag, JavaScript har Søndag som 0)
            let startTommeFelter = foersteDagIMdr === 0 ? 6 : foersteDagIMdr - 1;

            let gridHtml = `
                <div class="cal-header">MA</div><div class="cal-header">TI</div><div class="cal-header">ON</div>
                <div class="cal-header">TO</div><div class="cal-header">FR</div><div class="cal-header">LØ</div>
                <div class="cal-header">SØ</div>
            `;

            // Tomme felter inden måneden starter
            for(let i=0; i<startTommeFelter; i++) {
                gridHtml += `<div class="cal-day empty"></div>`;
            }

            let dagsDatoStr = new Date().toISOString().split('T')[0];

            // Byg månedens dage
            for(let dag=1; dag<=antalDageIMdr; dag++) {
                let nuDato = new Date(aar, mdr, dag);
                let nuDatoStr = nuDato.toISOString().split('T')[0];
                
                // Tjek status på opgaver på denne specifikke dag
                let dagensOpgaver = opgaver.filter(o => o.dato === nuDatoStr);
                let statusKlasse = '';
                
                if(dagensOpgaver.length > 0) {
                    let harAktive = dagensOpgaver.some(o => o.status === 'aktiv');
                    // Hvis der er uafsluttede opgaver i dag eller fremtiden = grøn. Hvis fortid og lukket = rød.
                    if(harAktive && nuDatoStr >= dagsDatoStr) {
                        statusKlasse = 'has-future';
                    } else {
                        statusKlasse = 'has-past';
                    }
                }

                let valgtKlasse = (nuDatoStr === valgtDatoIKalender) ? 'selected' : '';

                gridHtml += `<div class="cal-day ${statusKlasse} ${valgtKlasse}" onclick="vaelgKalenderDato('${nuDatoStr}')">${dag}</div>`;
            }

            document.getElementById('calendar-matrix').innerHTML = gridHtml;
            bygKalenderDetaljerListe();
        }

        function vaelgKalenderDato(datoStr) {
            valgtDatoIKalender = datoStr;
            bygKalender();
        }

        function bygKalenderDetaljerListe() {
            let detDiv = document.getElementById('kalender-detaljer');
            let opretDiv = document.getElementById('kalender-opret-sektion');
            let listeDiv = document.getElementById('kalender-valgt-dato-liste');
            
            detDiv.style.display = 'block';
            let dagsDatoStr = new Date().toISOString().split('T')[0];

            // Spærring for fortiden: Kun "Opret Opgave" hvis datoen er i dag eller i fremtiden
            if(valgtDatoIKalender >= dagsDatoStr) {
                opretDiv.innerHTML = `<button class="btn btn-primary" onclick="openOpretOpgaveModal('${valgtDatoIKalender}')">Opret opgave på denne dato</button>`;
            } else {
                opretDiv.innerHTML = `<p style="font-size:13px; color:var(--danger); font-weight:600; text-align:center;">Datoen er overskredet (Historik låst)</p>`;
            }

            let dagensOpgaver = opgaver.filter(o => o.dato === valgtDatoIKalender);
            let html = '';

            if(dagensOpgaver.length === 0) {
                html = '<p style="color:var(--text-secondary); font-size:14px;">Ingen opgaver på denne dato.</p>';
            } else {
                dagensOpgaver.forEach(o => {
                    let kunde = kunder.find(k => k.id === o.kundeId) || {navn: 'Ukendt', nummer: '???'};
                    let statusTekst = o.status === 'aktiv' ? `<span style="color:var(--success)">Aktiv</span>` : `<span style="color:var(--text-secondary)">Udført</span>`;
                    
                    html += `<div class="card" style="font-size:14px; padding:10px; border-style:dashed;">
                        <strong>[${kunde.nummer}] ${kunde.navn}</strong> - ${statusTekst}
                        <p style="font-size:12px; color:var(--text-secondary); margin-top:2px;">pH: ${o.ph} | Klor: ${o.klor} | Noter: ${o.noter || 'Ingen'}</p>
                    </div>`;
                });
            }
            listeDiv.innerHTML = html;
        }

        // --- STEMMESTYRING (MIKROFON-INPUT) ---
        function startStemmestyring(feltId) {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) return alert("Stemme-input understøttes desværre ikke i denne browser/enhed.");

            const recognition = new SpeechRecognition();
            recognition.lang = "da-DK";
            recognition.interimResults = false;
            
            let felt = document.getElementById(feltId);
            felt.placeholder = "Lytter... Tal nu.";
            
            recognition.addEventListener('result', e => {
                const tekst = Array.from(e.results)
                    .map(result => result[0])
                    .map(result => result.transcript)
                    .join('');
                
                felt.value = felt.value ? felt.value + " " + tekst : tekst;
                felt.placeholder = "";
            });

            recognition.addEventListener('end', () => { felt.placeholder = ""; });
            recognition.start();
        }

        // --- UAFHÆNGIG KEMIBEREGNER ---
        function beregnKemiUafhaengig() {
            let type = document.getElementById('calc-type').value;
            let nu = parseFloat(document.getElementById('calc-nu').value) || 0;
            let oensk = parseFloat(document.getElementById('calc-oensk').value) || 0;
            let resDiv = document.getElementById('calc-resultat');

            if(type === 'klor') {
                if(oensk <= nu) { resDiv.innerText = "Ingen klor behøves. Værdien er fin."; }
                else {
                    let mangler = oensk - nu;
                    let gramHensigt = Math.round(mangler * 30); // Fiktiv standard-metrik til hurtigt estimat
                    resDiv.innerText = `Tilsæt ca. ${gramHensigt}g klor pr. 10m³ for at hæve værdien.`;
                }
            } else if(type === 'ph_minus') {
                if(nu <= oensk) { resDiv.innerText = "pH er ikke for høj. Intet pH-Minus behøves."; }
                else {
                    let forHoej = nu - oensk;
                    let gramMinus = Math.round(forHoej * 100);
                    resDiv.innerText = `Tilsæt ca. ${gramMinus}g pH-Minus pr. 10m³ for at sænke værdien.`;
                }
            }
        }

        // --- INDSTILLINGER & VEDLIGEHOLDELSE ---
        function toggleTema() {
            nuvaerendeTema = (nuvaerendeTema === 'dark') ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', nuvaerendeTema);
            localStorage.setItem('pool_tema', nuvaerendeTema);
        }

        function lavBackup() {
            let data = { kunder: kunder, opgaver: opgaver };
            let blob = new Blob([JSON.stringify(data)], {type: "application/json"});
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `pool_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function gendanBackup() {
            let input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                let file = e.target.files[0];
                let reader = new FileReader();
                reader.onload = readerEvent => {
                    try {
                        let data = JSON.parse(readerEvent.target.result);
                        if(data.kunder && data.opgaver) {
                            kunder = data.kunder;
                            opgaver = data.opgaver;
                            localStorage.setItem('pool_kunder', JSON.stringify(kunder));
                            localStorage.setItem('pool_opgaver', JSON.stringify(opgaver));
                            alert('Backup gendannet fejlfrit!');
                            bygForside();
                        } else { alert('Fejl: Forkert filformat.'); }
                    } catch(err) { alert('Kunne ikke læse filen.'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function nulstilKundenumreMedAdvarsel() {
            if(confirm("Er du absolut sikker på, at du vil nulstille kundenumrene? Eksisterende kundenumre kan ændre sig, hvis rækkefølgen brydes!")) {
                kunder.forEach((k, index) => {
                    let aar = new Date().getFullYear();
                    k.nummer = `${aar}-${String(index + 1).padStart(3, '0')}`;
                });
                localStorage.setItem('pool_kunder', JSON.stringify(kunder));
                alert("Kundenumre er blevet genberegnet.");
                bygKundeListe();
            }
        }

        function nulstilAppMedAdvarsel() {
            if(confirm("Er du sikker på, at du vil genstarte appen? Ingen data slettes, systemet indlæser blot alt på ny.")) {
                window.location.reload();
            }
        }

        // Første opstart af forsiden
        bygForside();
    </script>
</body>
</html>
