<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Pool Service App v33</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; padding: 15px; padding-top: 80px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; }
        .sektion { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; }
        h2 { color: white; margin-top: 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .top-bar { position: fixed; top: 0; left: 0; right: 0; background: #000; padding: 10px; text-align: center; border-bottom: 1px solid #222; z-index: 90; display: flex; justify-content: center; gap: 5px; }
        .btn-nav { background: #374151; color: #d1d5db; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; max-width: 130px; }
        .btn-nav.active { background: #2563eb; color: white; }
        .card { background: #2a2a2a; border: 1px solid #444; padding: 12px; margin: 10px 0; border-radius: 8px; cursor: pointer; text-align: left; position: relative; }
        .card-actions { position: absolute; right: 10px; top: 12px; display: flex; gap: 10px; }
        .action-btn { background: none; border: none; font-size: 16px; cursor: pointer; width: auto; margin: 0; padding: 2px; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; color: #9ca3af; font-size: 12px; margin-bottom: 4px; }
        input, select, textarea { width: 100%; box-sizing: border-box; background-color: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 14px; }
        button { background: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-annuller { background: #4b5563; }
        .btn-start { background: #2563eb; }
        .btn-afslut { background: #16a34a; }
        .btn-maps { background: #0284c7; margin-bottom: 5px; }
        .btn-slet { background: #dc2626; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 15px; z-index: 100; }
        .modal-content { background: #1e1e1e; border: 1px solid #444; width: 100%; max-width: 350px; border-radius: 10px; padding: 20px; text-align: left; }
        .info-box { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; line-height: 1.5; }
        .kemi-resultat { background: #111827; border-left: 4px solid #2563eb; padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="top-bar">
    <button id="btn-nav-opg" onclick="visSide('side-opgaver')" class="btn-nav active">📋 Opgaver</button>
    <button id="btn-nav-kar" onclick="visSide('side-kartotek')" class="btn-nav">🏠 Kartotek</button>
    <button id="btn-nav-his" onclick="visSide('side-historik')" class="btn-nav">📜 Historik</button>
</div>

<div class="container">
    <div id="side-opgaver" class="sektion" style="display: block;">
        <h2>📋 Dagens Opgaver</h2>
        <div id="liste-beholder"></div>
        <button onclick="aabenOpretOpgaveSide()">➕ Opret Ny Opgave</button>
        <button onclick="haardNulstilApp()" class="btn-slet" style="margin-top: 40px; font-size: 12px; padding: 8px;">⚠️ Nulstil app-data ved fejl</button>
    </div>

    <div id="side-kartotek" class="sektion">
        <h2>🏠 Kundekartotek</h2>
        <div id="kartotek-beholder"></div>
        <button onclick="aabenOpretHusSide()" style="background:#16a34a;">🏠 Tilføj Nyt Hus</button>
    </div>

    <div id="side-historik" class="sektion">
        <h2>📜 Udførte Opgaver (Historik)</h2>
        <div id="historik-beholder"></div>
    </div>

    <div id="side-opret-opgave" class="sektion">
        <h2>➕ Opret Ny Opgave</h2>
        <div class="form-group"><label>Hus *</label><select id="opret-opg-hus-select"></select></div>
        <div class="form-group"><label>Dato *</label><input id="opret-opg-dato" type="date"></div>
        <div class="form-group">
            <label>Opgavetype</label>
            <select id="opret-opg-type">
                <option value="Poolkontrol">Poolkontrol (400 kr.)</option>
                <option value="Spakontrol">Spakontrol (300 kr.)</option>
                <option value="Ad-hoc">Ad-hoc (300 kr./påbegyndt time)</option>
            </select>
        </div>
        <button onclick="gemNyOpgave()">Gem Opgave</button>
        <button onclick="visSide('side-opgaver')" class="btn-annuller">Annuller</button>
    </div>

    <div id="side-opret-hus" class="sektion">
        <h2 id="hus-skema-titel">🏠 Tilføj Hus til Kartotek</h2>
        <input id="hus-id-skjult" type="hidden" value="">
        <div class="form-group"><label>Adresse *</label><input id="hus-adresse" type="text"></div>
        <div class="grid-2">
            <div class="form-group"><label>By</label><input id="hus-by" type="text"></div>
            <div class="form-group"><label>Nøglekode</label><input id="hus-kode" type="text"></div>
        </div>
        <div class="form-group"><label>Placering</label><input id="hus-placering" type="text"></div>
        <div class="form-group">
            <label>Hustype</label>
            <select id="hus-type" onchange="styreHustypeFelter()">
                <option value="Pool">Pool</option>
                <option value="Spa">Spa</option>
            </select>
        </div>
        <div class="form-group" id="felt-pool"><label>Pool (m³)</label><input id="hus-pool" type="number" value="25"></div>
        <div class="form-group" id="felt-spa" style="display:none;"><label>Spa (Liter)</label><input id="hus-spa" type="number" value="1500"></div>
        <button onclick="gemNytHus()" style="background:#16a34a;" id="btn-gem-hus">Gem i Kartotek</button>
        <button onclick="visSide('side-kartotek')" class="btn-annuller">Annuller</button>
    </div>
</div>

<div id="opgave-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
        <h3 id="m-navn" style="margin:0 0 5px 0;color:white;">Adresse</h3>
        <p id="m-type" style="margin:0 0 15px 0;color:#60a5fa;font-weight:bold;"></p>
        
        <div class="info-box">
            <p style="margin:2px 0;">📍 <span id="m-adresse"></span></p>
            <p style="margin:2px 0;">📅 Dato: <span id="m-dato-visning" style="color:#a3a3a3;"></span></p>
            <p style="margin:2px 0;">🔑 Nøglekode: <strong id="m-kode" style="color:#facc15;"></strong> | Placering: <span id="m-placering" style="color:#a3a3a3;"></span></p>
            <p style="margin:2px 0; color:#38bdf8; font-weight:bold;" id="m-stoerrelse-visning">-</p>
            <p id="m-status" style="margin:5px 0 0 0;font-style:italic;color:#a3a3a3; font-size:12px;"></p>
        </div>
        
        <div id="kemi-sektion" style="display:none; margin-bottom:15px;">
            <div class="grid-2">
                <div class="form-group"><label>Målt klor (mg/l)</label><input id="kemi-maalt-klor" type="number" step="0.1" value="0.0" oninput="beregnKemi()"></div>
                <div class="form-group"><label>Ønsket klor</label><input id="kemi-oensket-klor" type="number" step="0.1" value="6.0" oninput="beregnKemi()"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Målt pH</label><input id="kemi-maalt-ph" type="number" step="0.1" value="7.4" oninput="beregnKemi()"></div>
                <div class="form-group"><label>Ønsket pH</label><input id="kemi-oensket-ph" type="number" step="0.1" value="7.0" oninput="beregnKemi()"></div>
            </div>
            
            <div class="kemi-resultat">
                <strong>Dosering:</strong><br>
                💊 Daytabs: <span id="res-daytabs" style="color: #38bdf8; font-weight: bold;">0</span> stk.<br>
                🚀 Boost: <span id="res-boost" style="color: #60a5fa; font-weight: bold;">0</span> ml.<br>
                📉 Antiklor: <span id="res-antiklor" style="color: #ef4444; font-weight: bold;">0</span> ml.<br>
                ➖ pH-Minus: <span id="res-phminus" style="color: #facc15; font-weight: bold;">0</span> ml.<br>
                ➕ pH-Plus: <span id="res-phplus" style="color: #4ade80; font-weight: bold;">0</span> ml.
            </div>
        </div>

        <div id="omkostning-sektion" style="display:none; background:#2a2a2a; padding:10px; border-radius:6px; margin-bottom:15px; border:1px solid #444;">
            <label style="color:#60a5fa; font-weight:bold; margin-bottom:5px;">➕ Ekstra omkostninger</label>
            <div class="grid-2">
                <input id="omk-tekst" type="text" placeholder="F.eks. Nyt filter">
                <input id="omk-pris" type="number" placeholder="Pris i kr.">
            </div>
        </div>

        <button onclick="aabenKortNavigation()" id="btn-maps" class="btn-maps">🗺️ Start Navigation</button>
        <button id="btn-start" onclick="startTimer()" class="btn-start">▶ Start Opgave</button>
        <button id="btn-afslut" onclick="afslutOpgave()" class="btn-afslut" style="display:none;">🏁 Afslut & Gem</button>
        <button onclick="lukOpgaveModal()" class="btn-annuller">Luk vindue</button>
    </div>
</div>

<div id="historik-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
        <h3 style="margin:0 0 10px 0;color:white;">📜 Opgavedetaljer</h3>
        <div id="historik-detaljer-indhold" style="font-size:14px; line-height:1.6; color:#d1d5db;"></div>
        <button onclick="document.getElementById('historik-modal').style.display='none'" class="btn-annuller">Luk oversigt</button>
    </div>
</div>

<script>
    let kartotek = []; let opgaver = []; let historik = []; let aktivOpgaveId = null;
    let aktuelM3Mængde = 0;

    function initialiserData() {
        try {
            kartotek = JSON.parse(localStorage.getItem('pool_kartotek')) || [];
            opgaver = JSON.parse(localStorage.getItem('pool_opgaver')) || [];
            historik = JSON.parse(localStorage.getItem('pool_historik')) || [];
        } catch(e) { kartotek = []; opgaver = []; historik = []; }
        
        if (!Array.isArray(kartotek) || kartotek.length === 0) {
            kartotek = [{ id: 101, adresse: "Stenurtvej 28", by: "Blåvand", kode: "4321", placering: "Ved bagdøren", type: "Pool", pool: 27, spa: 0 }];
            opgaver = [{ id: 1, kartotekId: 101, dato: "2026-05-20", type: "Poolkontrol", startet: null }];
            gemAltTilHukommelse();
        }
    }

    function gemAltTilHukommelse() {
        localStorage.setItem('pool_kartotek', JSON.stringify(kartotek));
        localStorage.setItem('pool_opgaver', JSON.stringify(opgaver));
        localStorage.setItem('pool_historik', JSON.stringify(historik));
    }

    function styreHustypeFelter() {
        let type = document.getElementById('hus-type').value;
        document.getElementById('felt-pool').style.display = (type === 'Pool') ? 'block' : 'none';
        document.getElementById('felt-spa').style.display = (type === 'Spa') ? 'block' : 'none';
    }

    function visSide(sideId) {
        document.getElementById('side-opgaver').style.display = 'none';
        document.getElementById('side-kartotek').style.display = 'none';
        document.getElementById('side-historik').style.display = 'none';
        document.getElementById('side-opret-opgave').style.display = 'none';
        document.getElementById('side-opret-hus').style.display = 'none';
        
        let aktivSide = document.getElementById(sideId);
        if(aktivSide) aktivSide.style.display = 'block';
        
        document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
        if(sideId === 'side-opgaver') { document.getElementById('btn-nav-opg').classList.add('active'); bygOpgaveliste(); }
        if(sideId === 'side-kartotek') { document.getElementById('btn-nav-kar').classList.add('active'); bygKartotek(); }
        if(sideId === 'side-historik') { document.getElementById('btn-nav-his').classList.add('active'); bygHistorik(); }
    }

    function bygOpgaveliste() {
        let b = document.getElementById('liste-beholder'); b.innerHTML = '';
        if(opgaver.length === 0) { b.innerHTML = '<p style="color:#6b7280;text-align:center;">Ingen aktive opgaver.</p>'; return; }
        opgaver.forEach(o => {
            let hus = kartotek.find(h => h.id === o.kartotekId);
            let adresseVisning = hus ? hus.adresse : "Ukendt hus";
            let status = o.startet ? '⏳ I GANG' : 'KLAR';
            b.innerHTML += '<div class="card" onclick="aabenOpgaveModal('+o.id+')"><span style="float:right; background:#4b5563; padding:2px 6px; border-radius:4px; font-size:11px;">'+status+'</span><strong>'+adresseVisning+'</strong><br><span style="font-size:12px;color:#9ca3af;">'+o.type+'</span></div>';
        });
    }

    function bygKartotek() {
        let b = document.getElementById('kartotek-beholder'); b.innerHTML = '';
        if(kartotek.length === 0) { b.innerHTML = '<p style="color:#6b7280;text-align:center;">Kartoteket er tomt.</p>'; return; }
        kartotek.forEach(h => {
            b.innerHTML += '<div class="card"><strong>'+h.adresse+'</strong><br><span style="font-size:12px;color:#9ca3af;">'+h.by+' ('+h.type+')</span>' +
            '<div class="card-actions">' +
            '<button class="action-btn" onclick="event.stopPropagation(); redigerHus('+h.id+')">✏️</button>' +
            '<button class="action-btn" onclick="event.stopPropagation(); sletHus('+h.id+')">❌</button>' +
            '</div></div>';
        });
    }

    function bygHistorik() {
        let b = document.getElementById('historik-beholder'); b.innerHTML = '';
        if(historik.length === 0) { b.innerHTML = '<p style="color:#6b7280;text-align:center;">Ingen udførte opgaver endnu.</p>'; return; }
        historik.forEach((h, index) => {
            b.innerHTML += '<div class="card" onclick="visHistorikDetaljer('+index+')"><strong>'+h.adresse+'</strong><br><span style="font-size:12px;color:#16a34a;">✔️ '+h.type+' ('+(h.samletPris || 0)+' kr.)</span></div>';
        });
    }

    function sletHus(id) {
        if(confirm("Er du sikker på, at du vil slette dette hus fra kartoteket?")) {
            kartotek = kartotek.filter(h => h.id !== id);
            gemAltTilHukommelse(); bygKartotek();
        }
    }

    function aabenOpretHusSide() {
        document.getElementById('hus-id-skjult').value = "";
        document.getElementById('hus-skema-titel').innerText = "🏠 Tilføj Hus til Kartotek";
        document.getElementById('hus-adresse').value = "";
        document.getElementById('hus-by').value = "";
        document.getElementById('hus-kode').value = "";
        document.getElementById('hus-placering').value = "";
        document.getElementById('hus-type').value = "Pool";
        document.getElementById('hus-pool').value = "25";
        document.getElementById('hus-spa').value = "1500";
        styreHustypeFelter();
        visSide('side-opret-hus');
    }

    function redigerHus(id) {
        let h = kartotek.find(item => item.id === id); if(!h) return;
        document.getElementById('hus-id-skjult').value = h.id;
        document.getElementById('hus-skema-titel').innerText = "✏️ Rediger Hus";
        document.getElementById('hus-adresse').value = h.adresse;
        document.getElementById('hus-by').value = h.by || "";
        document.getElementById('hus-kode').value = h.kode || "";
        document.getElementById('hus-placering').value = h.placering || "";
        document.getElementById('hus-type').value = h.type || "Pool";
        document.getElementById('hus-pool').value = h.pool || 0;
        document.getElementById('hus-spa').value = h.spa || 0;
        styreHustypeFelter();
        visSide('side-opret-hus');
    }

    function gemNytHus() {
        let idSkjult = document.getElementById('hus-id-skjult').value;
        let adr = document.getElementById('hus-adresse').value; if(!adr) return;
        let b = document.getElementById('hus-by').value;
        let k = document.getElementById('hus-kode').value;
        let p = document.getElementById('hus-placering').value;
        let t = document.getElementById('hus-type').value;
        let poolV = parseFloat(document.getElementById('hus-pool').value) || 0;
        let spaV = parseFloat(document.getElementById('hus-spa').value) || 0;
        
        if(idSkjult) {
            let h = kartotek.find(item => item.id == idSkjult);
            if(h) {
                h.adresse = adr; h.by = b; h.kode = k; h.placering = p; h.type = t; h.pool = poolV; h.spa = spaV;
            }
        } else {
            kartotek.push({ id: Date.now(), adresse: adr, by: b, kode: k, placering: p, type: t, pool: poolV, spa: spaV });
        }
        gemAltTilHukommelse(); visSide('side-kartotek');
    }

    function aabenOpretOpgaveSide() {
        let select = document.getElementById('opret-opg-hus-select'); select.innerHTML = '';
        kartotek.forEach(h => { select.innerHTML += '<option value="'+h.id+'">'+h.adresse+'</option>'; });
        let iDato = document.getElementById('opret-opg-dato');
        if(iDato) { iDato.value = new Date().toISOString().split('T')[0]; }
        visSide('side-opret-opgave');
    }

    function gemNyOpgave() {
        let hId = parseInt(document.getElementById('opret-opg-hus-select').value);
        let d = document.getElementById('opret-opg-dato').value;
        let t = document.getElementById('opret-opg-type').value;
        opgaver.push({ id: Date.now(), kartotekId: hId, dato: d, type: t, startet: null });
        gemAltTilHukommelse(); visSide('side-opgaver');
    }

    function aabenOpgaveModal(id) {
        aktivOpgaveId = id;
        let o = opgaver.find(item => item.id === id); if(!o) return;
        let hus = kartotek.find(h => h.id === o.kartotekId) || { adresse: "Ukendt", kode: "Ingen", placering: "-", pool:25, spa:0, type: "Pool" };
        
        document.getElementById('m-navn').innerText = hus.adresse;
        document.getElementById('m-type').innerText = o.type;
        document.getElementById('m-adresse').innerText = hus.adresse;
        document.getElementById('m-kode').innerText = hus.kode || "-";
        document.getElementById('m-placering').innerText = hus.placering || "-";
        document.getElementById('m-dato-visning').innerText = o.dato || "-";
        
        let txtStoerrelse = "";
        if (hus.type === "Spa" || o.type === "Spakontrol") {
            txtStoerrelse = "Spa: " + (hus.spa || 1500) + " L";
            aktuelM3Mængde = (hus.spa > 100) ? (hus.spa / 1000) : hus.spa;
        } else {
            txtStoerrelse = "Pool: " + (hus.pool || 27) + " m³";
            aktuelM3Mængde = hus.pool || 27;
        }
        document.getElementById('m-stoerrelse-visning').innerText = txtStoerrelse;
        
        if(o.type === "Poolkontrol" || o.type === "Spakontrol") {
            document.getElementById('kemi-sektion').style.display = 'block';
            document.getElementById('kemi-maalt-klor').value = "0.0";
            document.getElementById('kemi-oensket-klor').value = "6.0";
            document.getElementById('kemi-maalt-ph').value = "7.4";
            document.getElementById('kemi-oensket-ph').value = "7.0";
            beregnKemi();
        } else {
            document.getElementById('kemi-sektion').style.display = 'none';
        }

        if(o.startet) {
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-afslut').style.display = 'block';
            document.getElementById('omkostning-sektion').style.display = 'block';
            document.getElementById('m-status').innerText = "Status: I gang";
        } else {
            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-afslut').style.display = 'none';
            document.getElementById('omkostning-sektion').style.display = 'none';
            document.getElementById('m-status').innerText = "Status: Klar";
        }
        document.getElementById('opgave-modal').style.display = 'flex';
    }

    function lukOpgaveModal() {
        document.getElementById('opgave-modal').style.display = 'none';
        bygOpgaveliste();
    }

    function startTimer() {
        let o = opgaver.find(item => item.id === aktivOpgaveId);
        if(o) o.startet = new Date().getTime();
        gemAltTilHukommelse(); aabenOpgaveModal(aktivOpgaveId);
    }

    function afslutOpgave() {
        let o = opgaver.find(item => item.id === aktivOpgaveId); if(!o) return;
        let hus = kartotek.find(h => h.id === o.kartotekId) || { adresse: "Ukendt" };
        let nu = new Date().getTime();
        
        // Tids- og prisberegning
        let minutterBrugt = o.startet ? Math.round((nu - o.startet) / 60000) : 0;
        if(minutterBrugt < 1) minutterBrugt = 1; 
        
        let basisPris = 0;
        if(o.type === "Poolkontrol") basisPris = 400;
        if(o.type === "Spakontrol") basisPris = 300;
        if(o.type === "Ad-hoc") {
            basisPris = Math.ceil(minutterBrugt / 60) * 300;
        }

        letekstraTekst = document.getElementById('omk-tekst').value || "Ingen";
        letekstraPris = parseFloat(document.getElementById('omk-pris').value) || 0;
        let totalPris = basisPris + letekstraPris;

        // Gem kemi data hvis relevant
        let kemiGemt = null;
        if(o.type === "Poolkontrol" || o.type === "Spakontrol") {
            kemiGemt = {
                maaltKlor: document.getElementById('kemi-maalt-klor').value,
                oensketKlor: document.getElementById('kemi-oensket-klor').value,
                maaltPh: document.getElementById('kemi-maalt-ph').value,
                oensketPh: document.getElementById('kemi-oensket-ph').value,
                daytabs: document.getElementById('res-daytabs').innerText,
                boost: document.getElementById('res-boost').innerText,
                antiklor: document.getElementById('res-antiklor').innerText,
                phminus: document.getElementById('res-phminus').innerText,
                phplus: document.getElementById('res-phplus').innerText
            };
        }

        historik.push({
            adresse: hus.adresse,
            type: o.type,
            dato: o.dato,
            minutter: minutterBrugt,
            basisPris: basisPris,
            ekstraTekst: letekstraTekst,
            ekstraPris: letekstraPris,
            samletPris: totalPris,
            kemi: kemiGemt
        });

        opgaver = opgaver.filter(item => item.id !== aktivOpgaveId);
        gemAltTilHukommelse(); lukOpgaveModal(); visSide('side-historik');
    }

    function beregnKemi() {
        let mKlor = parseFloat(document.getElementById('kemi-maalt-klor').value) || 0;
        let oKlor = parseFloat(document.getElementById('kemi-oensket-klor').value) || 0;
        let mPh = parseFloat(document.getElementById('kemi-maalt-ph').value) || 7.0;
        let oPh = parseFloat(document.getElementById('kemi-oensket-ph').value) || 7.0;

        let m3 = aktuelM3Mængde;
        let boost = 0; let daytabs = 0; let antiklor = 0; let phminus = 0; let phplus = 0;

        // Korrekt VL Consult logik synkroniseret med Excel
        if (mKlor < oKlor) {
            let mangel = oKlor - mKlor;
            boost = m3 * mangel * 1.35;
            daytabs = (m3 * mangel) / 4.5; // Justeret til præcis Excel-tabel-faktor
        } else if (mKlor > oKlor) {
            antiklor = (m3 * (mKlor - oKlor)) / 1.2;
        }

        if (mPh > oPh) {
            phminus = m3 * (mPh - oPh) * 35;
        } else if (mPh < oPh) {
            phplus = m3 * (oPh - mPh) * 35;
        }

        if (boost > 0) {
            phminus += (boost * 0.15); // Klor-stigningskompensation
        }

        document.getElementById('res-boost').innerText = Math.round(boost);
        document.getElementById('res-daytabs').innerText = Math.max(0, Math.round(daytabs));
        document.getElementById('res-antiklor').innerText = Math.round(antiklor);
        document.getElementById('res-phminus').innerText = Math.round(phminus);
        document.getElementById('res-phplus').innerText = Math.round(phplus);
    }

    function visHistorikDetaljer(index) {
        let h = historik[index]; if(!h) return;
        let indhold = `<strong>Hus:</strong> ${h.adresse}<br>` +
                      `<strong>Dato:</strong> ${h.dato || '-'}<br>` +
                      `<strong>Opgavetype:</strong> ${h.type}<br>` +
                      `<strong>Tidsforbrug:</strong> ${h.minutter} minutter<br><hr style="border-color:#444;">`;
        
        if(h.kemi) {
            indhold += `<strong>🧪 Udførte målinger & dosering:</strong><br>` +
                       `• Målt Klor: ${h.kemi.maaltKlor} mg/l (Ønsket: ${h.kemi.oensketKlor})<br>` +
                       `• Målt pH: ${h.kemi.maaltPh} (Ønsket: ${h.kemi.oensketPh})<br><br>` +
                       `<strong>Anbefalet dosering givet:</strong><br>` +
                       `• Daytabs: ${h.kemi.daytabs} stk.<br>` +
                       `• Boost: ${h.kemi.boost} ml.<br>` +
                       `• Antiklor: ${h.kemi.antiklor} ml.<br>` +
                       `• pH-Minus: ${h.kemi.phminus} ml.<br>` +
                       `• pH-Plus: ${h.kemi.phplus} ml.<br><hr style="border-color:#444;">`;
        }

        indhold += `<strong>💰 Pris-specifikation:</strong><br>` +
                   `• Basispris: ${h.basisPris} kr.<br>` +
                   `• Ekstra omkostninger: ${h.ekstraTekst} (${h.ekstraPris} kr.)<br>` +
                   `• <strong>Totalpris i alt: ${h.samletPris} kr.</strong>`;

        document.getElementById('historik-detaljer-indhold').innerHTML = indhold;
        document.getElementById('historik-modal').style.display = 'flex';
    }

    function aabenKortNavigation() {
        let o = opgaver.find(item => item.id === aktivOpgaveId); if(!o) return;
        let hus = kartotek.find(h => h.id === o.kartotekId);
        if(hus) window.open("http://maps.google.com/?q=" + encodeURIComponent(hus.adresse), '_blank');
    }

    function haardNulstilApp() { localStorage.clear(); initialiserData(); visSide('side-opgaver'); }

    initialiserData();
    visSide('side-opgaver');
</script>
