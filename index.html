<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pool Kontrol</title>
    <style>
        /* --- DESIGN SYSTEM & TEMAVARIABLER --- */
        :root {
            --bg-color: #000000;
            --surface-color: #121212;
            --surface-card: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-color: #00e676; /* Grøn */
            --danger-color: #ff5252; /* Rød */
            --border-color: #333333;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --surface-card: #fdfdfd;
            --text-main: #000000;
            --text-muted: #666666;
            --accent-color: #4caf50;
            --danger-color: #d32f2f;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            padding-bottom: 80px;
        }

        /* --- TOP FANER --- */
        .top-nav {
            display: flex;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 15px 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .nav-btn.active {
            color: var(--text-main);
            border-bottom: 3px solid var(--text-main);
        }

        /* --- SIDER / VIEWS --- */
        .view-section {
            display: none;
            padding: 15px;
        }

        .view-section.active {
            display: block;
        }

        /* --- OPTERTS-MENU (IDENTISK) --- */
        .opret-container {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .opret-container h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- OPGAVEKORT & OVERSKREDET VARIANT --- */
        .task-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            position: relative;
        }

        .task-card.overskredet {
            border: 2px solid var(--danger-color);
        }

        .badge-danger {
            background-color: var(--danger-color);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .task-title {
            font-size: 16px;
            font-weight: bold;
        }

        .task-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .task-details {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .btn-complete {
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        /* --- KALENDER SYSTEM --- */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
            margin-bottom: 20px;
        }

        .weekday-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: bold;
            padding: 5px 0;
        }

        .calendar-day {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }

        .calendar-day.empty {
            background: none;
            border: none;
            cursor: default;
        }

        /* Farvekoder på kalender-tal */
        .calendar-day.status-normal { color: var(--text-main); }
        .calendar-day.status-planned { color: var(--accent-color); }
        .calendar-day.status-completed { color: var(--danger-color); }
        
        .calendar-day.selected {
            outline: 2px solid var(--text-main);
        }

        .calendar-day.today::after {
            content: '';
            position: absolute;
            bottom: 3px;
            width: 4px;
            height: 4px;
            background-color: var(--text-main);
            border-radius: 50%;
        }

        /* --- GAMLE BUND-IKONER (BEVARET TIL OPDRATERING 3) --- */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .bottom-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body data-theme="dark">

    <nav class="top-nav">
        <button class="nav-btn active" onclick="switchView('tasks-view', this)">Opgaver</button>
        <button class="nav-btn" onclick="switchView('calendar-view', this); renderCalendar();">Kalender</button>
        <button class="nav-btn" onclick="switchView('customers-view', this)">Kunder</button>
    </nav>

    <main id="tasks-view" class="view-section active">
        <div class="opret-container">
            <h3>Opret ny opgave</h3>
            <div class="form-group">
                <label>Vælg kunde</label>
                <select id="task-customer-select" class="form-control"></select>
            </div>
            <div class="form-group">
                <label>Dato</label>
                <input type="date" id="task-date-input" class="form-control">
            </div>
            <button class="btn-primary" onclick="createTaskFromUI('task-customer-select', 'task-date-input')">Gem Opgave</button>
        </div>

        <h2 class="section-title">Ugens overblik</h2>
        <div id="active-tasks-list"></div>
    </main>

    <main id="calendar-view" class="view-section">
        <div class="calendar-header">
            <button class="btn-primary" style="width: auto; padding: 5px 15px;" onclick="changeMonth(-1)">< Måned</button>
            <h3 id="calendar-month-title">Maj 2026</h3>
            <button class="btn-primary" style="width: auto; padding: 5px 15px;" onclick="changeMonth(1)">Måned ></button>
        </div>

        <div class="calendar-grid" id="calendar-grid-container"></div>

        <div id="calendar-opret-box" class="opret-container" style="display: none;">
            <h3>Opret opgave på valgt dato</h3>
            <div class="form-group">
                <label>Vælg kunde</label>
                <select id="cal-customer-select" class="form-control"></select>
            </div>
            <div class="form-group">
                <label>Dato</label>
                <input type="date" id="cal-date-input" class="form-control" readonly>
            </div>
            <button class="btn-primary" onclick="createTaskFromUI('cal-customer-select', 'cal-date-input')">Gem Opgave</button>
        </div>

        <h3 class="section-title" id="selected-date-title" style="margin-top: 15px;">Vælg en dato for at se opgaver</h3>
        <div id="calendar-tasks-list"></div>
    </main>

    <main id="customers-view" class="view-section">
        <div class="opret-container">
            <h3>Opret ny kunde</h3>
            <div class="form-group">
                <label>Navn</label>
                <input type="text" id="cust-name" class="form-control" placeholder="f.eks. Jensen">
            </div>
            <div class="form-group">
                <label>Adresse</label>
                <input type="text" id="cust-address" class="form-control" placeholder="Vejnavn 12">
            </div>
            <button class="btn-primary" onclick="createCustomer()">Opret Kunde</button>
        </div>
        <h2 class="section-title">Kundekartotek</h2>
        <div id="customers-list"></div>
    </main>

    <div class="bottom-bar">
        <button class="bottom-btn">🛠️ Værktøj</button>
        <button class="bottom-btn" onclick="toggleTheme()">⚙️ Indstillinger</button>
    </div>

    <script>
        // Data states (Gemmes i LocalStorage)
        let customers = JSON.parse(localStorage.getItem('pool_customers')) || [];
        let tasks = JSON.parse(localStorage.getItem('pool_tasks')) || [];
        
        let currentCalendarDate = new Date();
        let selectedCalendarDate = new Date();

        // Gemmer ændringer
        function saveData() {
            localStorage.setItem('pool_customers', JSON.stringify(customers));
            localStorage.setItem('pool_tasks', JSON.stringify(tasks));
        }

        // Skift visning mellem top-faner
        function switchView(viewId, btnElement) {
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(viewId).classList.add('active');
            btnElement.classList.add('active');
        }

        // Hjælper: Formatér til YYYY-MM-DD
        function formatDateString(date) {
            let d = new Date(date),
                month = '' + (d.getMonth() + 1),
                day = '' + d.getDate(),
                year = d.getFullYear();

            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }

        // Hent mandag og søndag for indeværende uge
        function getThisWeeksRange() {
            let today = new Date();
            let dayOfWeek = today.getDay(); // 0 = søndag, 1 = mandag...
            let distanceFromMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            
            let monday = new Date(today);
            monday.setDate(today.getDate() + distanceFromMonday);
            monday.setHours(0,0,0,0);

            let sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23,59,59,999);

            return { monday, sunday };
        }

        // --- APPLIKATIONENS KERNELOGIK (OPDATERING 1) ---

        // Byg rullemenuer til kunder
        function updateCustomerDropdowns() {
            const selects = ['task-customer-select', 'cal-customer-select'];
            selects.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.innerHTML = customers.map(c => `<option value="${c.id}">${c.name} - ${c.address}</option>`).join('');
                if(customers.length === 0) el.innerHTML = '<option>Opret en kunde først...</option>';
            });
        }

        // Opret kunde
        function createCustomer() {
            const name = document.getElementById('cust-name').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            if(!name || !address) return alert('Udfyld venligst både navn og adresse.');

            const newCustomer = { id: Date.now().toString(), name, address };
            customers.push(newCustomer);
            saveData();
            
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-address').value = '';
            
            updateCustomerDropdowns();
            renderCustomers();
        }

        // Opret opgave fra enten Forside eller Kalender (Identisk logik)
        function createTaskFromUI(selectId, dateInputId) {
            const customerId = document.getElementById(selectId).value;
            const dateValue = document.getElementById(dateInputId).value;

            if(!customerId || !dateValue) return alert('Vælg venligst en kunde og en gyldig dato.');

            const newTask = {
                id: Date.now().toString(),
                customerId: customerId,
                date: dateValue,
                completed: false,
                completedDate: null
            };

            tasks.push(newTask);
            saveData();

            // Opdater visninger
            renderActiveTasks();
            renderCalendar();
            alert('Opgave oprettet!');
        }

        // Udfør en opgave (Flytter datoen til i dag, hvis den var overskredet)
        function completeTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if(task) {
                task.completed = true;
                task.completedDate = formatDateString(new Date()); // Logføres på den reelle afslutningsdag
                saveData();
                renderActiveTasks();
                renderCalendar();
            }
        }

        // Render Forsiden: Det "Skrumpende" Ugeoverblik + Overskredne opgaver
        function renderActiveTasks() {
            const listContainer = document.getElementById('active-tasks-list');
            if(!listContainer) return;
            listContainer.innerHTML = '';

            const { monday, sunday } = getThisWeeksRange();
            const todayStr = formatDateString(new Date());

            // Filtrér opgaver
            const overskredne = [];
            const denneUge = [];

            tasks.forEach(t => {
                if (t.completed) return; // Skjul afsluttede opgaver fra forsiden

                let taskDate = new Date(t.date);
                taskDate.setHours(0,0,0,0);

                if (taskDate < monday) {
                    overskredne.push(t); // Gamle opgaver slæbes med
                } else if (taskDate >= monday && taskDate <= sunday) {
                    // Det skrumpende element: Vis kun fra dags dato og ugen ud
                    if (t.date >= todayStr) {
                        denneUge.push(t);
                    }
                }
            });

            // Sorter denne uge kronologisk
            denneUge.sort((a,b) => a.date.localeCompare(b.date));

            // Byg HTML for Overskredne øverst
            overskredne.forEach(t => {
                const customer = customers.find(c => c.id === t.customerId) || {name: 'Ukendt', address: 'Ukendt'};
                listContainer.innerHTML += `
                    <div class="task-card overskredet">
                        <span class="badge-danger">⚠️ Overskredet</span>
                        <div class="task-header">
                            <div class="task-title">${customer.name}</div>
                            <div class="task-date">${t.date}</div>
                        </div>
                        <div class="task-details">${customer.address}</div>
                        <button class="btn-complete" onclick="completeTask('${t.id}')">Udført</button>
                    </div>
                `;
            });

            // Byg HTML for Ugens planlagte opgaver
            denneUge.forEach(t => {
                const customer = customers.find(c => c.id === t.customerId) || {name: 'Ukendt', address: 'Ukendt'};
                listContainer.innerHTML += `
                    <div class="task-card">
                        <div class="task-header">
                            <div class="task-title">${customer.name}</div>
                            <div class="task-date">${t.date}</div>
                        </div>
                        <div class="task-details">${customer.address}</div>
                        <button class="btn-complete" onclick="completeTask('${t.id}')">Udført</button>
                    </div>
                `;
            });

            if(overskredne.length === 0 && denneUge.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 20px;">Ingen opgaver for resten af ugen!</p>';
            }
        }

        // --- KALENDER DETALJERET LOGIK ---
        function changeMonth(direction) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            renderCalendar();
        }

        function selectDate(dateStr) {
            selectedCalendarDate = new Date(dateStr);
            renderCalendar();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-grid-container');
            const monthTitle = document.getElementById('calendar-month-title');
            if(!container) return;

            container.innerHTML = '';
            
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            
            const monthNames = ["Januar", "Februar", "Marts", "April", "Maj", "Juni", "Juli", "August", "September", "Oktober", "November", "December"];
            monthTitle.innerText = `${monthNames[month]} ${year}`;

            // Ugedags-labels
            const days = ['Ma', 'Ti', 'On', 'To', 'Fr', 'Lø', 'Sø'];
            days.forEach(d => container.innerHTML += `<div class="weekday-label">${d}</div>`);

            // Startdag i måneden (Korrigeret til dansk ugestart: mandag)
            let firstDay = new Date(year, month, 1).getDay();
            let leadingSpaces = firstDay === 0 ? 6 : firstDay - 1;
            
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Tomme felter inden den 1. i måneden
            for(let i = 0; i < leadingSpaces; i++) {
                container.innerHTML += `<div class="calendar-day empty"></div>`;
            }

            const todayStr = formatDateString(new Date());
            const selectedStr = formatDateString(selectedCalendarDate);

            // Generer selve dagene
            for(let day = 1; day <= daysInMonth; day++) {
                let d = new Date(year, month, day);
                let dStr = formatDateString(d);

                // Bestem farvekode baseret på opgavestatus
                let statusClass = 'status-normal'; // Standard: Sort/Hvid

                // Tjek om der er gennemførte eller planlagte opgaver på denne dag
                const dayTasks = tasks.filter(t => (t.completed ? t.completedDate : t.date) === dStr);
                
                if (dayTasks.length > 0) {
                    const harPlanlagte = dayTasks.some(t => !t.completed && t.date >= todayStr);
                    const harUdførte = dayTasks.some(t => t.completed);

                    if (harPlanlagte) {
                        statusClass = 'status-planned'; // Grøn
                    } else if (harUdførte) {
                        statusClass = 'status-completed'; // Rød
                    }
                }

                let isToday = dStr === todayStr ? 'today' : '';
                let isSelected = dStr === selectedStr ? 'selected' : '';

                container.innerHTML += `
                    <div class="calendar-day ${statusClass} ${isToday} ${isSelected}" onclick="selectDate('${dStr}')">
                        ${day}
                    </div>
                `;
            }

            // Opdater listen over opgaver under kalenderen for den valgte dag
            renderCalendarDayTasks(selectedStr);
        }

        function renderCalendarDayTasks(dateStr) {
            const listContainer = document.getElementById('calendar-tasks-list');
            const title = document.getElementById('selected-date-title');
            const opretBox = document.getElementById('calendar-opret-box');
            const calDateInput = document.getElementById('cal-date-input');

            title.innerText = `Opgaver d. ${dateStr}`;
            listContainer.innerHTML = '';

            // Hent opgaver der hører til dagen (enten planlagt på dagen, eller udført på dagen)
            const dayTasks = tasks.filter(t => (t.completed ? t.completedDate : t.date) === dateStr);

            dayTasks.forEach(t => {
                const customer = customers.find(c => c.id === t.customerId) || {name: 'Ukendt', address: 'Ukendt'};
                let statusText = t.completed ? `<span style="color:var(--danger-color); font-weight:bold;">✓ Udført i dag</span>` : `<span>Planlagt</span>`;
                let actionBtn = !t.completed ? `<button class="btn-complete" style="margin-top:5px;" onclick="completeTask('${t.id}')">Udført</button>` : '';

                listContainer.innerHTML += `
                    <div class="task-card">
                        <div class="task-header">
                            <div class="task-title">${customer.name}</div>
                            <div class="task-date">${statusText}</div>
                        </div>
                        <div class="task-details">${customer.address}</div>
                        ${actionBtn}
                    </div>
                `;
            });

            if(dayTasks.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Ingen registrerede opgaver på denne dato.</p>';
            }

            // SPÆRRING FOR FORTIDEN: Vis kun opret-menu, hvis datoen er i dag eller i fremtiden
            const todayStr = formatDateString(new Date());
            if(dateStr >= todayStr) {
                opretBox.style.display = 'block';
                calDateInput.value = dateStr; // Autoudfyld dato
            } else {
                opretBox.style.display = 'none'; // Skjul/lås hvis det er i fortiden
            }
        }

        // Render Kundekartotek
        function renderCustomers() {
            const container = document.getElementById('customers-list');
            if(!container) return;
            container.innerHTML = customers.map(c => `
                <div class="task-card">
                    <div class="task-title">${c.name}</div>
                    <div class="task-details" style="margin-bottom:0;">${c.address}</div>
                </div>
            `).join('');
            if(customers.length === 0) container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Ingen kunder oprettet endnu.</p>';
        }

        // Midlertidig tema-skifter (Flyttes/renses i Opdatering 3)
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        // --- INITIALISERING VED START ---
        window.onload = function() {
            // Sæt standard-dato til i dag på forsiden
            document.getElementById('task-date-input').value = formatDateString(new Date());
            
            updateCustomerDropdowns();
            renderActiveTasks();
            renderCustomers();
        };
    </script>
</body>
</html>
