<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Pool Service App v27 - OFFICIEL VL CONSULT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; padding: 15px; padding-top: 80px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; }
        .sektion { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; }
        h2 { color: white; margin-top: 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .top-bar { position: fixed; top: 0; left: 0; right: 0; background: #000; padding: 10px; text-align: center; border-bottom: 1px solid #222; z-index: 90; display: flex; justify-content: center; gap: 5px; }
        .btn-nav { background: #374151; color: #d1d5db; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; max-width: 130px; pointer-events: auto !important; }
        .btn-nav.active { background: #2563eb; color: white; }
        .sort-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-sort { background: #2a2a2a; border: 1px solid #444; color: #9ca3af; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; flex: 1; }
        .card { background: #2a2a2a; border: 1px solid #444; padding: 12px; margin: 10px 0; border-radius: 8px; cursor: pointer; text-align: left; position: relative; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; color: #9ca3af; font-size: 12px; margin-bottom: 4px; }
        input, select, textarea { width: 100%; box-sizing: border-box; background-color: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 14px; }
        button { background: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; pointer-events: auto !important; }
        .btn-annuller { background: #4b5563; }
        .btn-start { background: #2563eb; }
        .btn-afslut { background: #16a34a; }
        .btn-maps { background: #0284c7; margin-bottom: 5px; }
        .btn-slet { background: #dc2626; }
        .btn-rediger { background: #d97706; }
        .btn-ekstra { background: #1f2937; border: 1px dashed #4b5563; padding: 10px; font-size: 13px; margin-bottom: 10px; color: #60a5fa; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 15px; z-index: -1; }
        .modal-content { background: #1e1e1e; border: 1px solid #444; width: 100%; max-width: 350px; border-radius: 10px; padding: 20px; text-align: left; }
        .info-box { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        .hidden-field { display: none; }
        .udgift-tag { background: #374151; padding: 6px 10px; border-radius: 4px; font-size: 13px; margin: 6px 0; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #60a5fa; }
    </style>
</head>
<body>

<div class="top-bar">
    <button id="btn-nav-opg" onclick="visSide('side-opgaver')" class="btn-nav active">📋 Opgaver</button>
    <button id="btn-nav-kar" onclick="visSide('side-kartotek')" class="btn-nav">🏠 Kartotek</button>
    <button id="btn-nav-his" onclick="visSide('side-historik')" class="btn-nav">📜 Historik</button>
</div>

<div class="container">
    <div id="side-opgaver" class="sektion" style="display: block;">
        <h2>📋 Dagens Opgaver</h2>
        <div class="sort-bar">
            <button class="btn-sort" onclick="sorterOpgaver('dato')">📅 Sorter: Dato</button>
            <button class="btn-sort" onclick="sorterOpgaver('afstand')">🚗 Sorter: Afstand</button>
        </div>
        <div id="liste-beholder"></div>
        <button onclick="aabenOpretOpgaveSide()">➕ Opret Ny Opgave</button>
        <button onclick="haardNulstilApp()" class="btn-slet" style="margin-top: 40px; font-size: 12px; padding: 8px;">⚠️ Nulstil app-data ved fejl</button>
    </div>

    <div id="side-kartotek" class="sektion">
        <h2>🏠 Kundekartotek</h2>
        <div id="kartotek-beholder"></div>
        <button onclick="visSide('side-opret-hus')" style="background:#16a34a;">🏠 Tilføj Nyt Hus</button>
    </div>

    <div id="side-historik" class="sektion">
        <h2>📜 Udførte Opgaver (Historik)</h2>
        <div id="historik-beholder"></div>
    </div>

    <div id="side-opret-opgave" class="sektion">
        <h2>➕ Opret Ny Opgave</h2>
        <div class="form-group"><label>Hus *</label><select id="opret-opg-hus-select"></select></div>
        <div class="form-group"><label>Dato *</label><input id="opret-opg-dato" type="date"></div>
        <div class="form-group">
            <label>Opgavetype</label>
            <select id="opret-opg-type">
                <option value="Spakontrol">Spakontrol (300 kr.)</option>
                <option value="Poolkontrol">Poolkontrol (400 kr.)</option>
                <option value="Ad-hoc">Ad-hoc (300 kr. pr. time)</option>
            </select>
        </div>
        <button onclick="gemNyOpgave()">Gem Opgave</button>
        <button onclick="visSide('side-opgaver')" class="btn-annuller">Annuller</button>
    </div>

    <div id="side-opret-hus" class="sektion">
        <h2 id="hus-form-titel">🏠 Tilføj Hus til Kartotek</h2>
        <input type="hidden" id="rediger-hus-id" value="">
        <div class="form-group"><label>Adresse *</label><input id="hus-adresse" type="text"></div>
        <div class="grid-2">
            <div class="form-group"><label>Postnummer</label><input id="hus-postnr" type="number"></div>
            <div class="form-group"><label>By</label><input id="hus-by" type="text"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label>Ejer Navn</label><input id="hus-ejer" type="text"></div>
            <div class="form-group"><label>Telefon</label><input id="hus-tlf" type="tel"></div>
        </div>
        <div class="form-group"><label>E-mail</label><input id="hus-email" type="email"></div>
        <div class="grid-2">
            <div class="form-group"><label>Nøglekode</label><input id="hus-kode" type="text"></div>
            <div class="form-group"><label>Placering</label><input id="hus-placering" type="text"></div>
        </div>
        <div class="form-group">
            <label>Hustype</label>
            <select id="hus-type" onchange="styreHustypeFelter('hus-type', 'felt-spa', 'felt-pool')">
                <option value="Spa">Spa</option>
                <option value="Pool">Pool</option>
                <option value="Spa + Pool">Spa + Pool</option>
                <option value="Alm. Hus">Alm. Hus</option>
            </select>
        </div>
        <div class="form-group hidden-field" id="felt-spa"><label>Spa (Liter)</label><input id="hus-spa" type="number"></div>
        <div class="form-group hidden-field" id="felt-pool"><label>Pool (m³)</label><input id="hus-pool" type="number"></div>
        <div class="form-group"><label>Tekniske Noter</label><textarea id="hus-noter" rows="3"></textarea></div>
        <button id="btn-gem-hus" onclick="gemNytHus()" style="background:#16a34a;">Gem i Kartotek</button>
        <button onclick="annullerHusForm()" class="btn-annuller">Annuller</button>
    </div>
</div>

<div id="opgave-modal" class="modal">
    <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
        <h3 id="m-navn" style="margin:0 0 5px 0;color:white;">Adresse</h3>
        <p id="m-type" style="margin:0 0 15px 0;color:#60a5fa;font-weight:bold;"></p>
        <div class="info-box">
            <p style="margin:5px 0;">📍 <span id="m-adresse"></span></p>
            <p style="margin:5px 0;">🔑 Nøglekode: <strong id="m-kode" style="color:#facc15;"></strong> | Placering: <span id="m-placering" style="color:#a3a3a3;"></span></p>
            <p id="m-status" style="margin:5px 0 0 0;font-style:italic;color:#a3a3a3;"></p>
        </div>
        <div id="kemi-sektion" style="display:none; background:rgba(37, 99, 235, 0.1); border: 1px solid #2563eb; padding:12px; border-radius:8px; margin-bottom:15px;">
            <h4 style="margin:0 0 5px 0; color:#60a5fa; font-size:14px;">🧪 Officiel VL Consult Beregner</h4>
            <div class="grid-2">
                <div class="form-group"><label>Bassinstørrelse (m³)</label><input id="kemi-m3-input" type="number" step="0.1" oninput="beregnKemi()"></div>
                <div class="form-group"><label>Ønsket klor (mg/l)</label><input id="kemi-oensket-klor" type="number" step="0.1" value="6.0" oninput="beregnKemi()"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Målt klor (mg/l)</label><input id="kemi-maalt-klor" type="number" step="0.1" value="0.0" oninput="beregnKemi()"></div>
                <div class="form-group"><label>Målt pH</label><input id="kemi-maalt-ph" type="number" step="0.1" value="7.4" oninput="beregnKemi()"></div>
            </div>
            <div style="background: #111827; border-left: 4px solid #facc15; padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 14px; line-height: 1.5;">
                <strong>Dosering ifølge tabeller:</strong><br>
                🚀 Klor Boost: <span id="res-boost" style="color: #60a5fa; font-weight: bold;">0</span> ml.<br>
                📉 Antiklor: <span id="res-antiklor" style="color: #ef4444; font-weight: bold;">0</span> ml.<br>
                ➖ pH-Minus: <span id="res-phminus" style="color: #facc15; font-weight: bold;">0</span> ml.
            </div>
        </div>
        <div id="m-tilfojede-udgifter-liste"></div>
        <button onclick="aabenKortNavigation()" id="btn-maps" class="btn-maps">🗺️ Start Navigation</button>
        <button id="btn-start" onclick="startTimer()" class="btn-start">▶ Start Opgave</button>
        <button id="btn-afslut" onclick="afslutOpgave()" class="btn-afslut" style="display:none;">🏁 Afslut & Gem</button>
        <button onclick="lukOpgaveModal()" class="btn-annuller">Luk vindue (Pause)</button>
    </div>
</div>

<script>
    let kartotek = []; let opgaver = []; let historik = []; let aktivOpgaveId = null;

    function initialiserData() {
        try {
            kartotek = JSON.parse(localStorage.getItem('pool_kartotek')) || [];
            opgaver = JSON.parse(localStorage.getItem('pool_opgaver')) || [];
            historik = JSON.parse(localStorage.getItem('pool_historik')) || [];
        } catch(e) { kartotek = []; opgaver = []; historik = []; }
        if (!Array.isArray(kartotek)) kartotek = [];
        if (!Array.isArray(opgaver)) opgaver = [];
        if (!Array.isArray(historik)) historik = [];
        if(kartotek.length === 0 && opgaver.length === 0) genererStandardData();
    }

    function genererStandardData() {
        kartotek = [
            { id: 101, adresse: "Stenurtvej 28", postnr: "6857", by: "Blåvand", ejer: "Jens Poulsen", tlf: "40506070", email: "jens@sommerhus.dk", kode: "4321", placering: "Ved bagdøren", type: "Pool", spa: 0, pool: 23, nuvaerendeAfstand: 5, noter: "" }
        ];
        opgaver = [
            { id: 1, kartotekId: 101, dato: "2026-05-20", type: "Poolkontrol", startet: null, ekstraUdgifter: [] }
        ];
        gemAltTilHukommelse();
    }

    function gemAltTilHukommelse() {
        localStorage.setItem('pool_kartotek', JSON.stringify(kartotek));
        localStorage.setItem('pool_opgaver', JSON.stringify(opgaver));
        localStorage.setItem('pool_historik', JSON.stringify(historik));
    }

    function visSide(sideId) {
        document.getElementById('side-opgaver').style.display = 'none';
        document.getElementById('side-kartotek').style.display = 'none';
        document.getElementById('side-historik').style.display = 'none';
        document.getElementById('side-opret-opgave').style.display = 'none';
        document.getElementById('side-opret-hus').style.display = 'none';
        let aktivSide = document.getElementById(sideId);
        if(aktivSide) aktivSide.style.display = 'block';
        if(sideId === 'side-opgaver') bygOpgaveliste();
        if(sideId === 'side-kartotek') bygKartotek();
        if(sideId === 'side-historik') bygHistorik();
    }

    function bygOpgaveliste() {
        let b = document.getElementById('liste-beholder'); b.innerHTML = '';
        if(opgaver.length === 0) { b.innerHTML = '<p style="color:#6b7280;text-align:center;">Ingen aktive opgaver.</p>'; return; }
        opgaver.forEach(o => {
            let hus = kartotek.find(h => h.id === o.kartotekId);
            let adresseVisning = hus ? hus.adresse : "Ukendt hus";
            let status = o.startet ? '⏳ I GANG' : 'KLAR';
            b.innerHTML += '<div class="card" onclick="aabenOpgaveModal('+o.id+')"><span style="float:right; background:#4b5563; padding:2px 6px; border-radius:4px; font-size:11px;">'+status+'</span><strong>'+adresseVisning+'</strong><br><span style="font-size:12px;color:#9ca3af;">'+o.type+'</span></div>';
        });
    }

    function aabenOpgaveModal(id) {
        aktivOpgaveId = id;
        let o = opgaver.find(item => item.id === id); if(!o) return;
        let hus = kartotek.find(h => h.id === o.kartotekId) || { adresse: "Ukendt", kode: "Ingen", placering: "-", pool:25 };
        document.getElementById('m-navn').innerText = hus.adresse;
        document.getElementById('m-type').innerText = o.type;
        document.getElementById('m-adresse').innerText = hus.adresse;
        document.getElementById('m-kode').innerText = hus.kode;
        document.getElementById('m-placering').innerText = hus.placering;
        
        if(o.type === "Poolkontrol" || o.type === "Spakontrol") {
            document.getElementById('kemi-sektion').style.display = 'block';
            document.getElementById('kemi-m3-input').value = hus.pool || 25;
            beregnKemi();
        } else {
            document.getElementById('kemi-sektion').style.display = 'none';
        }

        if(o.startet) {
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-afslut').style.display = 'block';
        } else {
            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-afslut').style.display = 'none';
        }
        document.getElementById('opgave-modal').style.display = 'flex';
        document.getElementById('opgave-modal').style.zIndex = '100';
    }

    function lukOpgaveModal() {
        document.getElementById('opgave-modal').style.display = 'none';
        bygOpgaveliste();
    }

    function startTimer() {
        let o = opgaver.find(item => item.id === aktivOpgaveId);
        if(o) o.startet = new Date().getTime();
        gemAltTilHukommelse(); aabenOpgaveModal(aktivOpgaveId);
    }

    function afslutOpgave() {
        let o = opgaver.find(item => item.id === aktivOpgaveId); if(!o) return;
        let hus = kartotek.find(h => h.id === o.kartotekId) || { adresse: "Ukendt" };
        historik.push({ adresse: hus.adresse, type: o.type, totalPris: o.type === "Spakontrol" ? 300 : 400 });
        opgaver = opgaver.filter(item => item.id !== aktivOpgaveId);
        gemAltTilHukommelse(); lukOpgaveModal(); visSide('side-historik');
    }

    function bygKartotek() {
        let b = document.getElementById('kartotek-beholder'); b.innerHTML = '';
        kartotek.forEach(h => { b.innerHTML += '<div class="card"><strong>'+h.adresse+'</strong></div>'; });
    }

    function bygHistorik() {
        let b = document.getElementById('historik-beholder'); b.innerHTML = '';
        historik.forEach(h => { b.innerHTML += '<div class="card"><strong>'+h.adresse+'</strong><br>'+h.type+'</div>'; });
    }

    function aabenKortNavigation() {
        let o = opgaver.find(item => item.id === aktivOpgaveId); if(!o) return;
        let hus = kartotek.find(h => h.id === o.kartotekId);
        if(hus) window.open("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(hus.adresse), '_blank');
    }

    function beregnKemi() {
        let m3 = parseFloat(document.getElementById('kemi-m3-input').value) || 0;
        let mKlor = parseFloat(document.getElementById('kemi-maalt-klor').value) || 0;
        let oKlor = parseFloat(document.getElementById('kemi-oensket-klor').value) || 0;
        let mPh = parseFloat(document.getElementById('kemi-maalt-ph')  .value) || 7.0;

        let boost = 0;
        let antiklor = 0;
        let phminus = 0;

        // 1. KLOR-BOOST BEREGNING (1,35 ml pr. m3 pr. mg/l klor-mangel)
        if (mKlor < oKlor) {
            let klorMangel = oKlor - mKlor;
            boost = m3 * klorMangel * 1.35;
        } 
        // 2. ANTIKLOR BEREGNING (Formel side 24: divideret med 1,2)
        else if (mKlor > oKlor) {
            let klorOverskud = mKlor - oKlor;
            antiklor = (klorOverskud * m3) / 1.2;
        }

        // 3. PH-MINUS BEREGNING (Officiel tabel: Sænkning med 0,1 kræver 3,5 ml pr. m3)
        // Vi regner ud fra den Målte pH ned til ideal-værdien 7,0.
        if (mPh > 7.0) {
            let phSkalSaenkes = mPh - 7.0;
            // Da 0,1 i forskel giver 3,5 ml, svarer det til at gange med 35 for en hel pH-enhed.
            phminus = m3 * phSkalSaenkes * 35;
        }

        // 4. DEN HEMMELIGE DETALJE: KLOR-STIGNING (Hvis der boostes, stiger pH!)
        // Ifølge dine papirer medfører tilsætning af klor en stigning i pH-værdien.
        // For at modvirke klor-stigningen lægger vi ekstra pH-minus til, hvis der boostes.
        if (boost > 0) {
            // Vi kompenserer svarende til, at klor-tilsætningen løfter pH kunstigt undervejs.
            phminus += (boost * 0.15); 
        }

        // Skriv resultaterne ud på skærmen (afrundet pænt)
        document.getElementById('res-boost').innerText = Math.round(boost);
        document.getElementById('res-antiklor').innerText = Math.round(antiklor);
        document.getElementById('res-phminus').innerText = Math.round(phminus);
    }

    function haardNulstilApp() { localStorage.clear(); initialiserData(); visSide('side-opgaver'); }
    function aabenOpretOpgaveSide() { visSide('side-opret-opgave'); }
    function gemNytHus() { visSide('side-kartotek'); }

    initialiserData();
</script>
</body>
</html>
